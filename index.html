/* ---------- JOB DETAIL ---------- */
PAGES.job=()=>{const j=job(UI.param);if(!j){UI.route='jobs';return PAGES.jobs()}const o=order(j.order);const d=jobDue(j);
  const counts={};j.items.forEach(i=>{const n=S.template[i.stage];counts[n]=(counts[n]||0)+1});
  const minStage=Math.min(...j.items.map(i=>i.stage));const atMin=j.items.filter(i=>i.stage===minStage).length;
  const cost={material:0,labour:0,additional:0};j.costs.forEach(c=>cost[c.bucket]+=c.amount);const planned=j.cut.reduce((a,c)=>a+pieceCost(c)*lineQty(j,c.item),0);
  const byStage={};j.costs.forEach(c=>{byStage[c.stage]=byStage[c.stage]||{material:0,labour:0,additional:0};byStage[c.stage][c.bucket]+=c.amount});
  return`<div class="crumb"><a href="#jobs">All Jobs</a>${ic('chevron-right','width:13px')}${j.id}</div>
  ${head(`${j.id} ${pill(jobStatus(j))}`,`Order <span class="link" onclick="viewOrder('${o.id}')">${o.id}</span> · ${esc(o.cust)} · ${o.cat} ${dueChip(d)}`,`<button class="btn" onclick="printDoc('cut','${j.id}')">${ic('printer')}View cutting list</button>`)}
  <div class="grid g4 mb">${[['Delivery by',fmtD(o.expected),'calendar'],['Created',fmtD(j.created),'clock'],['Production manager',j.manager,'user-cog'],['Sales person',o.sales||'—','user']].map(x=>`<div class="card kpi" style="cursor:default"><div class="l" style="display:flex;gap:6px;align-items:center">${ic(x[2],'width:15px;color:var(--muted)')}${x[0]}</div><div class="v" style="font-size:18px">${esc(x[1])}</div></div>`).join('')}</div>
  <div class="card mb"><div class="card-h"><h3>${ic('git-branch')}Products & their stage</h3><span class="sub">${Object.entries(counts).map(([k,v])=>`${k} ${v}`).join(' · ')}</span></div>
   <div class="card-b" style="padding-top:10px">
   ${minStage<DONE()?`<div class="help" style="justify-content:space-between;align-items:center;flex-wrap:wrap">${ic('fast-forward')}<div style="flex:1"><b>Move together:</b> ${atMin} product(s) in <b>${S.template[minStage]}</b> can all go to <b>${S.template[minStage+1]}</b>.${S.template[minStage]==='QC'?' (QC must be checked one by one.)':''}</div>${S.template[minStage]!=='QC'?`<button class="btn sm pri" onclick="bulkMove('${j.id}',${minStage})">Move all → ${S.template[minStage+1]}</button>`:''}</div>`:`<div class="help good">${ic('party-popper')}All products are complete! Mark the order as delivered from the order page.</div>`}
   ${j.items.map((it,k)=>`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line2);flex-wrap:wrap"><div style="min-width:220px;flex:1"><b>${esc(it.name)}</b> <span class="muted small">× ${it.qty}</span><div class="small muted">Last move: ${esc(it.history[it.history.length-1].stage)} · ${fmtDT(it.history[it.history.length-1].at)}${it.team?' · '+esc(it.team):''}</div></div>
     <div class="dots" title="${it.stage+1} of ${S.template.length}">${S.template.map((s,i)=>`<i class="${i<it.stage?'d':i===it.stage?'c':''}" title="${s}"></i>`).join('')}</div>${stagePill(S.template[it.stage])}
     ${it.stage<DONE()?`<button class="btn sm ${S.template[it.stage]==='QC'?'green':''}" onclick="moveItem('${j.id}',${k})">${S.template[it.stage]==='QC'?ic('clipboard-check')+'Do QC check':'Move to '+S.template[it.stage+1]+' '+ic('arrow-right')}</button>`:ic('check-circle-2','color:var(--green)')}</div>`).join('')}</div></div>
  <div class="card mb"><div class="card-h"><h3>${ic('list')}Order items</h3></div><div class="tw" style="margin-top:8px"><table><thead><tr><th>Item</th><th>Category</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Line total</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td class="b">${esc(l.name)}</td><td>${o.cat}</td><td class="right">${l.qty} ${l.unit||''}</td><td class="right tnum">${inr(l.rate)}</td><td class="right tnum b">${inr(lineAmt(l))}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card mb"><div class="card-h"><h3>${ic('scissors')}Cutting list</h3><button class="btn sm pri" onclick="addPiece('${j.id}')">${ic('plus')}Add piece</button></div>
   <div class="card-b" style="padding-top:8px"><div class="small muted mb">Size is for 1 item (Length in feet, Width & Thickness in inches). Volume in cft and cost are worked out automatically.</div>${j.cut.length?cutTable(j,true):'<div class="empty">'+ic('scissors')+'<div>No pieces yet. Click <b>Add piece</b> to start the cutting list.</div></div>'}</div></div>
  <div class="grid g2 mb"><div class="card"><div class="card-h"><h3>${ic('calculator')}Product cost</h3><button class="btn sm" onclick="recordCost('${j.id}')">${ic('plus')}Record cost</button></div><div class="card-b">
    <div class="mini mb">${[['Material',cost.material],['Labour',cost.labour],['Other charges',cost.additional],['Product cost',cost.material+cost.labour+cost.additional]].map(x=>`<div><small>${x[0]}</small><b class="tnum">${inr(x[1])}</b></div>`).join('')}</div>
    <div class="small muted mb">Cutting plan (planned): ${inr(planned)} – for reference only, not added to the actual cost.</div>
    ${Object.keys(byStage).length?`<div class="tw"><table><thead><tr><th>Stage</th><th class="right">Material</th><th class="right">Labour</th><th class="right">Other</th></tr></thead><tbody>${Object.entries(byStage).map(([s,v])=>`<tr><td>${stagePill(s)}</td><td class="right tnum">${v.material?inr(v.material):'—'}</td><td class="right tnum">${v.labour?inr(v.labour):'—'}</td><td class="right tnum">${v.additional?inr(v.additional):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}</div></div>
   <div class="card"><div class="card-h"><h3>${ic('receipt')}Charges & history</h3></div><div class="card-b">
    ${j.costs.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)"><div><b>${c.bucket==='labour'?'👷 ':''}${esc(c.label)}</b> · ${esc(c.item)}<div class="small muted">${esc(c.stage)} · ${fmtD(c.at)}${c.note?' · '+esc(c.note):''}</div></div><b class="tnum">${inr(c.amount)}</b></div>`).join('')||'<div class="small muted mb">No charges recorded yet</div>'}
    <div class="timeline" style="margin-top:14px">${j.history.slice(0,8).map(e=>`<div class="ev">${esc(e.msg)}<small>${esc(e.by)} · ${fmtDT(e.at)}</small></div>`).join('')}</div></div></div></div>`};
function cutTable(j,edit){const groups={};j.cut.forEach((c,i)=>(groups[c.item]=groups[c.item]||[]).push([c,i]));let tv=0,tc=0;
  const rows=Object.entries(groups).map(([item,ps])=>{const q=lineQty(j,item);const gv=ps.reduce((a,[c])=>a+cft(c)*q,0),gc=ps.reduce((a,[c])=>a+pieceCost(c)*q,0);tv+=gv;tc+=gc;
   return`<tr style="background:var(--thbg)"><td colspan="5" class="b">${esc(item)} <span class="muted">×${q}</span></td><td class="right b tnum">${gv.toFixed(4)} cft</td><td class="right b tnum">${inr(gc)}</td>${edit?'<td></td>':''}</tr>`+ps.map(([c,i])=>{const m=mat(c.mat)||{};return`<tr><td style="padding-left:28px">${esc(c.piece)}</td><td class="small">${esc(m.name||'?')} <span class="muted">₹${m.price}/${m.unit}</span></td><td class="tnum">${c.L} ft × ${c.W} in × ${c.T} in</td><td class="right">${c.qty}</td><td class="right muted">×${q}</td><td class="right tnum">${(cft(c)*q).toFixed(4)}</td><td class="right tnum">${inr(pieceCost(c)*q)}</td>${edit?`<td class="right"><button class="btn sm ghost" onclick="S.jobs.find(x=>x.id==='${j.id}').cut.splice(${i},1);save();rerender()">${ic('trash-2','width:14px')}</button></td>`:''}</tr>`}).join('')}).join('');
  return`<div class="card tw" style="box-shadow:none"><table><thead><tr><th>Piece</th><th>Material</th><th>Size (L × W × T)</th><th class="right">Qty</th><th class="right">Order</th><th class="right">Volume</th><th class="right">Cost</th>${edit?'<th></th>':''}</tr></thead><tbody>${rows}<tr><td colspan="5" class="b">PLANNED MATERIAL TOTAL</td><td class="right b tnum">${tv.toFixed(4)} cft</td><td class="right b tnum">${inr(tc)}</td>${edit?'<td></td>':''}</tr></tbody></table></div>`}
function addPiece(jid){const j=job(jid);const timber=S.materials.filter(m=>['Timber','Plywood'].includes(m.type));
  openModal('Add piece to cutting list',`<div class="form"><div class="fld full"><label>For which product?</label><select class="sel" id="p_item">${j.items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</select></div>
  <div class="fld"><label>Piece name <em>*</em></label><input class="inp" id="p_name" placeholder="e.g. Leg, Top Plank"></div><div class="fld"><label>Material</label><select class="sel" id="p_mat">${timber.map(m=>`<option value="${m.id}">${esc(m.name)} · ₹${m.price}/${m.unit}</option>`).join('')}</select></div>
  <div class="fld"><label>Length (feet)</label><input class="inp" type="number" step="0.25" id="p_L" value="6" oninput="pv()"></div><div class="fld"><label>Width (inches)</label><input class="inp" type="number" step="0.25" id="p_W" value="4" oninput="pv()"></div>
  <div class="fld"><label>Thickness (inches)</label><input class="inp" type="number" step="0.25" id="p_T" value="2" oninput="pv()"></div><div class="fld"><label>How many pieces?</label><input class="inp" type="number" id="p_Q" value="1" oninput="pv()"></div>
  <div class="full help good" id="p_prev"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePiece('${jid}')">${ic('check')}Add piece</button>`);
  $('#p_mat').onchange=pv;pv()}
function pv(){const p={L:num('p_L'),W:num('p_W'),T:num('p_T'),qty:num('p_Q'),mat:val('p_mat')};$('#p_prev').innerHTML=`${ic('calculator')}<div>Volume: <b>${cft(p).toFixed(4)} cft</b> · Cost: <b>${inr(pieceCost(p))}</b></div>`;lucide.createIcons()}
function savePiece(jid){const name=val('p_name');if(!name)return toast('Enter piece name','alert-circle');const j=job(jid);j.cut.push({item:val('p_item'),piece:name,mat:val('p_mat'),L:num('p_L'),W:num('p_W'),T:num('p_T'),qty:num('p_Q')||1});
  const mc=j.cut.reduce((a,c)=>a+pieceCost(c)*lineQty(j,c.item),0);(S.orderLog[j.order]=S.orderLog[j.order]||[]).unshift({at:nowISO(),msg:`Cutting list updated (${jid}): ${j.cut.length} pieces, material cost ${inr(mc)}`});save();closeModal();rerender();toast('Piece added')}
function recordCost(jid){const j=job(jid);openModal('Record cost',`<div class="form"><div class="fld"><label>Type</label><select class="sel" id="rc_l"><option value="material|Material">Material used</option>${S.labels.filter(l=>l.active).map(l=>`<option value="${l.bucket}|${esc(l.name)}">${esc(l.name)}</option>`).join('')}</select></div>
  <div class="fld"><label>Product</label><select class="sel" id="rc_i">${j.items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</select></div><div class="fld"><label>Amount (₹) <em>*</em></label><input class="inp" type="number" id="rc_a"></div><div class="fld"><label>Note</label><input class="inp" id="rc_n" placeholder="e.g. 1500 × 2 days"></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveCost('${jid}')">${ic('check')}Save</button>`)}
function saveCost(jid){const a=num('rc_a');if(a<=0)return toast('Enter amount','alert-circle');const j=job(jid);const[b,l]=val('rc_l').split('|');const it=j.items.find(i=>i.name===val('rc_i'));j.costs.push({label:l,bucket:b,item:val('rc_i'),stage:S.template[it.stage],at:todayISO(),amount:a,note:val('rc_n')});j.history.unshift({at:nowISO(),by:ROLES[S.role],msg:`${l} ${inr(a)} recorded for ${val('rc_i')}`});save();closeModal();rerender();toast('Cost recorded')}
function moveItem(jid,k){const j=job(jid),it=j.items[k];if(it.stage>=DONE())return;const cur=S.template[it.stage],next=S.template[it.stage+1];
  if(cur==='QC')return openQC(jid,k);
  openModal(`Move to next stage`,`<div class="help">${ic('package')}<div><b>${esc(it.name)}</b> × ${it.qty}<br>${stagePill(cur)} ${ic('arrow-right','width:14px;vertical-align:-3px')} ${stagePill(next)}</div></div><div class="form">
  <div class="fld"><label>Which team will do "${next}"?</label><select class="sel" id="mv_t"><option value="">— Choose team (optional) —</option>${S.teams.filter(t=>t.active).map(t=>`<option ${it.team===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  <div class="fld"><label>Labour charge for "${cur}" (₹)</label><input class="inp" type="number" id="mv_c" placeholder="Optional"><div class="hint">Leave empty if not paid per piece</div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doMove('${jid}',${k})">${ic('check')}Move to ${next}</button>`)}
function doMove(jid,k,team,charge){const j=job(jid),it=j.items[k];team=team??val('mv_t');charge=charge??num('mv_c');const from=S.template[it.stage];it.stage++;const to=S.template[it.stage];if(team)it.team=team;
  it.history.push({stage:to,at:nowISO(),by:ROLES[S.role]});j.history.unshift({at:nowISO(),by:ROLES[S.role],msg:`${it.name} moved ${from} → ${to}${team?' ('+team+')':''}`});
  if(charge>0)j.costs.push({label:'Labour Charge',bucket:'labour',item:it.name,stage:from,at:todayISO(),amount:charge,note:''});
  audit(`${jid} · ${it.name} moved to ${to}`);save();closeModal();rerender();toast(`${it.name} → ${to}`,'arrow-right-circle')}
function bulkMove(jid,stage){const j=job(jid);let n=0;j.items.forEach((it,k)=>{if(it.stage===stage){doMove(jid,k,'',0);n++}});toast(`${n} product(s) moved to ${S.template[stage+1]}`,'fast-forward')}
function openQC(jid,k){const j=job(jid),it=j.items[k];openModal(`QC check – ${esc(it.name)}`,`<div class="help">${ic('clipboard-check')}<div>Check each point. If all are fine, click <b>Pass</b>. If something is wrong, write the reason and click <b>Send back for rework</b>.</div></div>
  <div class="grid g2" style="gap:8px">${QC_LIST.map(c=>`<label class="check"><input type="checkbox" class="qcb">${c}</label>`).join('')}</div>
  <div class="fld" style="margin-top:14px"><label>If not OK – what is the problem?</label><input class="inp" id="qc_r" style="width:100%" placeholder="e.g. Door shutter size mismatch"></div>`,
  `<button class="btn red" onclick="qcResult('${jid}',${k},false)">${ic('rotate-ccw')}Send back for rework</button><button class="btn green" onclick="qcResult('${jid}',${k},true)">${ic('check')}Pass – mark Complete</button>`)}
function qcResult(jid,k,ok){const j=job(jid),it=j.items[k];const passed=[...document.querySelectorAll('.qcb')].filter(c=>c.checked).length;
  if(ok&&passed<QC_LIST.length)return toast(`Tick all ${QC_LIST.length} points to pass, or send it back for rework`,'alert-circle');const r=val('qc_r');if(!ok&&!r)return toast('Please write the problem','alert-circle');
  if(ok){it.stage=DONE();it.history.push({stage:'Complete',at:nowISO(),by:ROLES[S.role]});j.history.unshift({at:nowISO(),by:ROLES[S.role],msg:`${it.name} passed QC (${passed}/${QC_LIST.length})`});toast('QC passed ✅ – product complete')}
  else{it.stage=S.template.indexOf('Carpentry');it.history.push({stage:'Carpentry (rework)',at:nowISO(),by:ROLES[S.role]});j.history.unshift({at:nowISO(),by:ROLES[S.role],msg:`${it.name} failed QC – rework: ${r}`});toast('Sent back to Carpentry for rework','rotate-ccw')}
  save();closeModal();rerender()}

/* ---------- TEAMS & WORKERS ---------- */
PAGES.teams=()=>modHead('teams','Add your workshop staff, then group them into teams for each station (cutting, assembly, polishing…).',`${seg('teamTab',[['teams','Teams'],['workers','Workers']])}<button class="btn pri" onclick="${UI.teamTab==='teams'?'editTeam()':'editWorker()'}">${ic('plus')}${UI.teamTab==='teams'?'Create Team':'Add Worker'}</button>`)+
 (UI.teamTab==='teams'?`<div class="grid g3">${S.teams.map(t=>`<div class="card team" style="${t.active?'':'opacity:.6'}"><div class="top2"><div><b style="font-size:15px">${esc(t.name)}</b><div class="small muted">Created ${fmtD(t.at)}</div></div><span class="pill p-blue">${t.station}</span></div>
   <div class="small" style="margin:12px 0 8px">${ic('hard-hat','width:15px;vertical-align:-3px;color:var(--amber)')} <b>${t.members.length} workers</b></div>
   ${t.members.map(w=>worker(w)).filter(Boolean).map(w=>`<div class="mem"><div class="who">${av(w.name)}<span>${esc(w.name)}</span></div><span class="pill p-gray">${w.station}</span></div>`).join('')}
   <div class="foot"><button class="btn sm" onclick="editTeam('${t.id}')">${ic('pencil')}Edit</button><button class="btn sm" onclick="const t=S.teams.find(x=>x.id==='${t.id}');t.active=!t.active;save();rerender()">${ic('power')}${t.active?'Deactivate':'Activate'}</button><button class="btn sm red" style="margin-left:auto" onclick="ask('Delete this team?',()=>{S.teams=S.teams.filter(x=>x.id!=='${t.id}');save();rerender()})">${ic('trash-2')}</button></div></div>`).join('')}</div>`
 :`<div class="card"><div class="tw"><table><thead><tr><th>Worker</th><th>Station</th><th>Team</th><th class="right">Daily wage</th><th>Days present (this month)</th><th>Status</th><th></th></tr></thead><tbody>${S.workers.map(w=>`<tr class="click" onclick="editWorker('${w.id}')"><td><div class="who">${av(w.name)}<b>${esc(w.name)}</b></div></td><td><span class="pill p-gray">${w.station}</span></td><td>${esc(teamOf(w.id)?.name||'—')}</td><td class="right tnum">${inr(w.wage)}</td><td>${monthDays(w.id,todayISO().slice(0,7)).p} P · ${monthDays(w.id,todayISO().slice(0,7)).h} H</td><td>${pill(w.active?'Active':'Inactive')}</td><td>${ic('chevron-right','color:#B8C0D2')}</td></tr>`).join('')}</tbody></table></div><div class="tfoot">${S.workers.length} workers · daily wages are sample values</div></div>`);
function editTeam(id){const t=S.teams.find(x=>x.id===id)||{station:'Assembly',members:[]};
  openModal(id?'Edit Team':'Create Team',`<div class="form"><div class="fld"><label>Team name <em>*</em></label><input class="inp" id="t_name" value="${esc(t.name||'')}" placeholder="e.g. Team Ashraf Furniture"></div><div class="fld"><label>Station</label><select class="sel" id="t_st">${STATIONS.map(s=>`<option ${t.station===s?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="fld full"><label>Pick workers</label><div class="grid g3" style="gap:6px">${S.workers.map(w=>`<label class="check"><input type="checkbox" class="tw_m" value="${w.id}" ${t.members.includes(w.id)?'checked':''}>${esc(w.name)}</label>`).join('')}</div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveTeam('${id||''}')">${ic('check')}Save team</button>`,'wide')}
function saveTeam(id){const name=val('t_name');if(!name)return toast('Enter team name','alert-circle');const members=[...document.querySelectorAll('.tw_m:checked')].map(c=>c.value);
  S.teams.forEach(t=>{if(t.id!==id)t.members=t.members.filter(m=>!members.includes(m))});
  if(id)Object.assign(S.teams.find(x=>x.id===id),{name,station:val('t_st'),members});else S.teams.push({id:'TM'+(S.seq.team++),name,station:val('t_st'),members,active:true,at:todayISO()});save();closeModal();rerender();toast('Team saved')}
function editWorker(id){const w=worker(id)||{station:'Assembly',wage:900,active:true};
  openModal(id?'Edit Worker':'Add Worker',`<div class="form"><div class="fld"><label>Name <em>*</em></label><input class="inp" id="w_name" value="${esc(w.name||'')}"></div><div class="fld"><label>Phone</label><input class="inp" id="w_ph" value="${esc(w.phone||'')}"></div>
  <div class="fld"><label>Station</label><select class="sel" id="w_st">${STATIONS.map(s=>`<option ${w.station===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="fld"><label>Daily wage (₹)</label><input class="inp" type="number" id="w_wage" value="${w.wage}"></div>
  <label class="check full"><input type="checkbox" id="w_act" ${w.active?'checked':''}>Active (show in attendance)</label></div>`,
  `${id?`<button class="btn red" style="margin-right:auto" onclick="ask('Remove this worker?',()=>{S.workers=S.workers.filter(x=>x.id!=='${id}');S.teams.forEach(t=>t.members=t.members.filter(m=>m!=='${id}'));save();rerender()},'Yes, remove')">${ic('trash-2')}Remove</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveWorker('${id||''}')">${ic('check')}Save</button>`)}
function saveWorker(id){const name=val('w_name');if(!name)return toast('Enter name','alert-circle');const d={name,phone:val('w_ph'),station:val('w_st'),wage:num('w_wage'),active:$('#w_act').checked};
  if(id)Object.assign(worker(id),d);else S.workers.push({id:'W'+(S.seq.wrk++)+'x',...d});save();closeModal();if(UI.route!=='teams'){UI.teamTab='workers';nav('teams')}else rerender();toast('Worker saved')}

/* ---------- ATTENDANCE ---------- */
function monthDays(wid,ym){let p=0,h=0,a=0;Object.entries(S.att).forEach(([d,m])=>{if(d.startsWith(ym)){const v=m[wid];if(v==='P')p++;else if(v==='H')h++;else if(v==='A')a++}});return{p,h,a}}
PAGES.attendance=()=>{const d=UI.attDate,day=S.att[d]||{};const ws=S.workers.filter(w=>w.active);const c={P:0,H:0,A:0,U:0};ws.forEach(w=>c[day[w.id]||'U']++);
  return modHead('attendance','Mark who came to work today. Wages in Payroll are worked out from this.',seg('attTab',[['mark','Mark attendance'],['register','Monthly register']]))+
  (UI.attTab==='mark'?`<div class="grid g4 mb">${[['Present',c.P,'#16A34A'],['Half day',c.H,'#D97706'],['Absent',c.A,'#DC2626'],['Not marked',c.U,'#64748B']].map(x=>`<div class="card kpi" style="cursor:default"><div class="l">${x[0]}</div><div class="v" style="color:${x[2]}">${x[1]}</div></div>`).join('')}</div>
  <div class="card"><div class="bar"><button class="ibtn" onclick="UI.attDate=addDays(UI.attDate,-1);rerender()">${ic('chevron-left')}</button><input class="inp" type="date" value="${d}" max="${todayISO()}" onchange="UI.attDate=this.value;rerender()"><button class="ibtn" ${d>=todayISO()?'disabled style="opacity:.4"':''} onclick="if(UI.attDate<todayISO()){UI.attDate=addDays(UI.attDate,1);rerender()}">${ic('chevron-right')}</button>
   ${fsearch('attQ','Search worker…','attRows')}${fsel('attSt','All stations',STATIONS,'attRows')}<button class="btn green" onclick="markAll()">${ic('check-check')}Mark all unmarked as Present</button></div>
  <div class="tw"><table><thead><tr><th>Worker</th><th>Station</th><th>Team</th><th>Working on</th><th>Attendance</th></tr></thead><tbody id="attRows">${attRows()}</tbody></table></div></div>`
  :attRegister())};
function attRows(){const d=UI.attDate,day=S.att[d]||{};const q=UI.attQ.toLowerCase();return S.workers.filter(w=>w.active&&(!UI.attSt||w.station===UI.attSt)&&(!q||w.name.toLowerCase().includes(q))).map(w=>{const t=teamOf(w.id);const prod=t?S.jobs.flatMap(j=>j.items.filter(i=>i.team===t.name&&i.stage<DONE()).map(i=>i.name)):[];const v=day[w.id];
  return`<tr><td><div class="who">${av(w.name)}<b>${esc(w.name)}</b></div></td><td>${w.station}</td><td>${esc(t?.name||'—')}</td><td class="small">${prod.length?esc(prod.slice(0,2).join(', '))+(prod.length>2?` +${prod.length-2}`:''):'<span class="muted">No product assigned</span>'}</td>
  <td><div class="att">${[['A','Absent'],['H','Half day'],['P','Present']].map(([k,l])=>`<button class="${v===k?k:''}" onclick="setAtt('${w.id}','${k}')">${l}</button>`).join('')}</div></td></tr>`}).join('')||emptyRow(5,'No workers found','users')}
function setAtt(wid,v){(S.att[UI.attDate]=S.att[UI.attDate]||{})[wid]=v;save();rerender()}
function markAll(){const day=S.att[UI.attDate]=S.att[UI.attDate]||{};let n=0;S.workers.filter(w=>w.active).forEach(w=>{if(!day[w.id]){day[w.id]='P';n++}});save();rerender();toast(`${n} worker(s) marked Present`)}
function attRegister(){const ym=UI.attDate.slice(0,7);const[y,m]=ym.split('-').map(Number);const days=new Date(y,m,0).getDate();const t=todayISO();
  return`<div class="card"><div class="bar"><b>${new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><span class="small muted">P = Present · H = Half day · A = Absent · grey = Sunday / not marked</span></div><div class="tw"><table class="reg"><thead><tr><th>Worker</th>${Array.from({length:days},(_,i)=>`<th style="padding:8px 2px;text-align:center">${i+1}</th>`).join('')}<th>P</th><th>H</th><th>A</th></tr></thead><tbody>
  ${S.workers.filter(w=>w.active).map(w=>{const md=monthDays(w.id,ym);return`<tr><td>${esc(w.name)}</td>${Array.from({length:days},(_,i)=>{const dt=ym+'-'+pad(i+1,2);const v=(S.att[dt]||{})[w.id];return`<td>${dt>t?'':`<i class="${v||'S'}">${v||'·'}</i>`}</td>`}).join('')}<td class="b c-green">${md.p}</td><td class="b c-amber">${md.h}</td><td class="b c-red">${md.a}</td></tr>`}).join('')}</tbody></table></div></div>`}

/* ---------- STAGES & TEMPLATES ---------- */
PAGES.stages=()=>{const list=S.stages.filter(s=>UI.stageF==='all'||(UI.stageF==='on'?s.active:!s.active));
  return modHead('stages','Set the steps every product goes through in the workshop. Change names and colours anytime.',`<button class="btn pri" onclick="editStage()">${ic('plus')}New Stage</button>`)+`
  <div class="card mb"><div class="card-h"><h3>${ic('layers')}Stage master</h3>${seg('stageF',[['all',`All (${S.stages.length})`],['on',`Active (${S.stages.filter(s=>s.active).length})`],['off',`Off (${S.stages.filter(s=>!s.active).length})`]])}</div>
   <div class="card-b" style="padding:12px 0 4px"><div class="small muted" style="padding:0 16px 10px">Rename or recolour a stage and it changes everywhere. The start stage cannot be switched off.</div>
   ${list.map(s=>`<div class="stg ${s.active?'':'off'}"><span class="pill" style="background:${s.color}22;color:${s.color};font-size:13px">${esc(s.name)}</span>${s.start?'<span class="pill p-amber">START · fixed</span>':''}${s.rework?'<span class="pill p-teal">↩ Rework allowed</span>':''}${!s.active?'<span class="pill p-gray">Switched off</span>':''}<span class="small muted">${s.station?'📍 '+esc(s.station):'Works at all stations'}</span>
    <div class="acts">${s.start?'':`<button class="btn sm ghost" onclick="toggleStage('${s.id}')">${s.active?'Switch off':'Switch on'}</button>`}<button class="btn sm ghost" onclick="editStage('${s.id}')">${ic('pencil')}Edit</button></div></div>`).join('')}</div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>${ic('workflow')}Pipeline template</h3><span class="pill p-blue">Standard Production · Default</span></div><div class="card-b">
   <div class="small muted mb">New jobs follow these steps in this order:</div><div class="flow">${S.template.map((s,i)=>(i?ic('arrow-right'):'')+stagePill(s)).join('')}</div></div></div>
  <div class="card"><div class="card-h"><h3>${ic('tags')}Charge labels</h3><button class="btn sm" onclick="addLabel()">${ic('plus')}Add label</button></div><div class="card-b">
   <div class="small muted mb">Used when recording costs on a job. Product cost = material + labour + other charges.</div>
   ${S.labels.map(l=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)"><span class="pill ${l.bucket==='labour'?'p-amber':'p-blue'}">${l.bucket==='labour'?'👷 Labour':'Other'}</span><b>${esc(l.name)}</b>${l.system?'<span class="pill p-gray">System</span>':''}<button class="btn sm ghost" style="margin-left:auto" onclick="askInput('Rename label','Label name',S.labels.find(x=>x.id==='${l.id}').name,v=>{S.labels.find(x=>x.id==='${l.id}').name=v;save();rerender()})">Rename</button></div>`).join('')}</div></div></div>`};
function addLabel(){openModal('Add charge label',`<div class="form"><div class="fld full"><label>Label name <em>*</em></label><input class="inp" id="lb_n" placeholder="e.g. Polishing Charge"></div><div class="fld full"><label>Type</label><div class="chips"><label><input type="radio" name="lb_b" value="labour" checked><span>👷 Labour</span></label><label><input type="radio" name="lb_b" value="additional"><span>Other charge</span></label></div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="const n=val('lb_n');if(!n)return toast('Enter label name','alert-circle');S.labels.push({id:'LB'+Date.now(),name:n,bucket:document.querySelector('input[name=lb_b]:checked').value,system:false,active:true});save();closeModal();rerender();toast('Label added')">${ic('check')}Add</button>`)}
function toggleStage(id){const s=S.stages.find(x=>x.id===id);if(s.active&&S.template.includes(s.name))return toast('This stage is used in the pipeline template – it cannot be switched off','alert-circle');s.active=!s.active;save();rerender()}
function editStage(id){const s=S.stages.find(x=>x.id===id)||{color:'#3B82F6',station:''};openModal(id?'Edit Stage':'New Stage',`<div class="form"><div class="fld"><label>Stage name <em>*</em></label><input class="inp" id="s_name" value="${esc(s.name||'')}"></div><div class="fld"><label>Colour</label><input class="inp" type="color" id="s_col" value="${s.color}" style="padding:4px;width:80px"></div>
  <div class="fld full"><label>Station (optional)</label><input class="inp" id="s_st" value="${esc(s.station)}" placeholder="Leave empty = all stations"></div>
  ${!id?`<label class="check full"><input type="checkbox" id="s_tpl">Add to the pipeline template (before QC)</label>`:''}</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveStage('${id||''}')">${ic('check')}Save</button>`)}
function saveStage(id){const name=val('s_name');if(!name)return toast('Enter stage name','alert-circle');
  if(id){const s=S.stages.find(x=>x.id===id);const old=s.name;Object.assign(s,{name,color:val('s_col'),station:val('s_st')});const ti=S.template.indexOf(old);if(ti>=0)S.template[ti]=name}
  else{S.stages.push({id:'ST'+Date.now(),name,color:val('s_col'),station:val('s_st'),start:false,rework:false,active:true});if($('#s_tpl').checked){S.template.splice(S.template.indexOf('QC'),0,name);S.jobs.forEach(j=>j.items.forEach(i=>{if(i.stage>=S.template.indexOf(name))i.stage++}))}}
  save();closeModal();rerender();toast('Stage saved')}

/* ---------- BILLING & ACCOUNTS ---------- */
PAGES.billing=()=>{const tv=S.orders.reduce((a,o)=>a+total(o),0),rc=S.payments.reduce((a,p)=>a+p.amount,0);const late=S.orders.filter(o=>total(o)-paidOf(o.id)>0&&o.expected<todayISO());
  return modHead('billing','Who has paid, who still owes money, and print invoices. Simple.',`<button class="btn green" onclick="recordPayment()">${ic('plus')}Record Payment</button>`)+`
  <div class="grid g4 mb">${[['Total billed',inr(tv),'file-text','#3B82F6'],['Money received',inr(rc),'wallet','#16A34A'],['Still to collect',inr(tv-rc),'hand-coins','#D97706'],['Past delivery date & unpaid',late.length+' orders','alarm-clock','#DC2626']].map(x=>`<div class="card kpi" style="cursor:default"><div style="display:flex;justify-content:space-between"><div class="l">${x[0]}</div><span class="ico" style="background:${x[3]}1F;color:${x[3]}">${ic(x[2])}</span></div><div class="v tnum">${x[1]}</div></div>`).join('')}</div>
  <div class="card mb target" style="padding:16px 18px"><b>Collection progress</b><div class="tr"><i style="width:${tv?rc/tv*100:0}%"></i><span>${inr(rc)} of ${inr(tv)} collected (${tv?Math.round(rc/tv*100):0}%)</span></div></div>
  ${tabs('billTab',[['receivable','Money to collect'],['payments','Payments received'],['invoices','Invoices']])}
  ${UI.billTab==='receivable'?`<div class="card tw"><table><thead><tr><th>Customer</th><th>Order</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th><th>Collected</th><th>Delivery by</th><th></th></tr></thead><tbody>
   ${S.orders.filter(o=>total(o)-paidOf(o.id)>0).sort((a,b)=>a.expected.localeCompare(b.expected)).map(o=>{const t=total(o),p=paidOf(o.id);return`<tr><td><div class="who">${av(o.cust)}<div><b>${esc(o.cust)}</b><small>${esc(o.mobile||'')}</small></div></div></td><td class="code"><span class="link" onclick="viewOrder('${o.id}')">${o.id}</span></td><td class="right tnum">${inr(t)}</td><td class="right tnum c-green">${inr(p)}</td><td class="right tnum b c-amber">${inr(t-p)}</td><td><div class="prog"><i style="width:${p/t*100}%;background:var(--green)"></i></div></td><td>${fmtD(o.expected)} ${o.expected<todayISO()?'<span class="pill p-red">Late</span>':''}</td><td class="right"><button class="btn sm green" onclick="recordPayment('${o.id}')">Collect</button></td></tr>`}).join('')||emptyRow(8,'Everyone has paid 🎉','party-popper')}</tbody></table></div>`
  :UI.billTab==='payments'?`<div class="card tw"><table><thead><tr><th>Receipt</th><th>Date</th><th>Order</th><th>Customer</th><th>Mode</th><th>By</th><th class="right">Amount</th><th></th></tr></thead><tbody>${S.payments.slice().reverse().map(p=>`<tr><td class="code">${p.id}</td><td>${fmtDT(p.at)}</td><td class="code">${p.order}</td><td>${esc(order(p.order)?.cust)}</td><td><span class="pill p-gray">${p.mode}</span></td><td>${esc(p.by)}</td><td class="right tnum b c-green">${inr(p.amount)}</td><td><button class="btn sm ghost" onclick="printDoc('receipt','${p.id}')">${ic('printer')}</button></td></tr>`).join('')||emptyRow(8,'No payments yet','wallet')}</tbody></table></div>`
  :`<div class="card tw"><table><thead><tr><th>Invoice</th><th>Order</th><th>Customer</th><th>Date</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>${S.orders.map(o=>{const t=total(o),p=paidOf(o.id);return`<tr><td class="code">INV-${o.id.slice(3)}</td><td class="code">${o.id}</td><td>${esc(o.cust)}</td><td>${fmtD(o.date)}</td><td class="right tnum b">${inr(t)}</td><td>${p>=t?'<span class="pill p-green">Paid</span>':p>0?'<span class="pill p-amber">Part paid</span>':'<span class="pill p-red">Unpaid</span>'}</td><td class="right"><button class="btn sm" onclick="printDoc('invoice','${o.id}')">${ic('eye')}View</button></td></tr>`}).join('')}</tbody></table></div>`}`};

/* ---------- PAYROLL ---------- */
PAGES.payroll=()=>{const ym=UI.payMonth;const pr=S.payroll[ym]=S.payroll[ym]||{};
  const rows=S.workers.filter(w=>w.active).map(w=>{const d=monthDays(w.id,ym);const gross=(d.p+d.h*0.5)*w.wage;const r=pr[w.id]||{adv:0,paid:false};return{w,d,gross,adv:r.adv||0,net:gross-(r.adv||0),paid:r.paid}});
  const tot=rows.reduce((a,r)=>a+r.net,0),paid=rows.filter(r=>r.paid).reduce((a,r)=>a+r.net,0);
  return modHead('payroll','Salary is worked out from attendance: full day = full wage, half day = half wage. Subtract any advance and mark as paid.',`<input class="inp" type="month" value="${ym}" onchange="UI.payMonth=this.value;rerender()">`)+`
  <div class="grid g3 mb">${[['Total salary this month',inr(tot),'#3B82F6'],['Already paid',inr(paid),'#16A34A'],['Still to pay',inr(tot-paid),'#D97706']].map(x=>`<div class="card kpi" style="cursor:default"><div class="l">${x[0]}</div><div class="v tnum" style="color:${x[2]}">${x[1]}</div></div>`).join('')}</div>
  <div class="help">${ic('info')}<div>Formula: <b>(Present days + ½ × Half days) × Daily wage − Advance = Net pay</b>. Daily wages are sample values – change them in Teams & Workers.</div></div>
  <div class="card tw"><table><thead><tr><th>Worker</th><th>Station</th><th class="right">Present</th><th class="right">Half day</th><th class="right">Absent</th><th class="right">Daily wage</th><th class="right">Earned</th><th class="right">Advance taken</th><th class="right">Net pay</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><div class="who">${av(r.w.name)}<b>${esc(r.w.name)}</b></div></td><td>${r.w.station}</td><td class="right c-green b">${r.d.p}</td><td class="right c-amber b">${r.d.h}</td><td class="right c-red b">${r.d.a}</td><td class="right tnum">${inr(r.w.wage)}</td><td class="right tnum">${inr(r.gross)}</td><td class="right"><input class="inp" type="number" style="width:100px;height:32px;text-align:right" value="${r.adv}" ${r.paid?'disabled':''} onchange="setPay('${r.w.id}','adv',+this.value||0)"></td><td class="right tnum b">${inr(r.net)}</td><td>${r.paid?`<span class="pill p-green">${ic('check','width:12px;height:12px')}Paid</span> <button class="btn sm ghost" onclick="setPay('${r.w.id}','paid',false)">Undo</button>`:`<button class="btn sm green" onclick="setPay('${r.w.id}','paid',true)">Mark paid</button>`}</td></tr>`).join('')}</tbody></table></div>`};
function setPay(wid,k,v){const pr=S.payroll[UI.payMonth]=S.payroll[UI.payMonth]||{};pr[wid]=pr[wid]||{adv:0,paid:false};pr[wid][k]=v;if(k==='paid'&&v)audit(`Salary marked paid for ${worker(wid).name} (${UI.payMonth})`);save();rerender()}

PAGES.settings=()=>modHead('settings','Add staff logins, choose what each role can see, and check who did what.',UI.setTab==='users'?`<button class="btn pri" onclick="editUser()">${ic('user-plus')}Create User</button>`:'')+
 tabs('setTab',[['users','Staff users'],['access','Who can see what'],['audit','Audit log']])+
 (UI.setTab==='users'?`<div class="card tw"><table><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${S.users.map(u=>`<tr class="click" onclick="editUser('${u.id}')"><td><div class="who">${av(u.name)}<b>${esc(u.name)}</b></div></td><td>${esc(u.email||'—')}</td><td>${esc(u.mobile||'—')}</td><td><b class="small">${u.role.toUpperCase()}</b>${u.cat?` <span class="pill p-green" style="font-size:11px">${u.cat}</span>`:''}</td><td>${pill(u.active?'Active':'Inactive')}</td><td>${ic('chevron-right','color:#B8C0D2')}</td></tr>`).join('')}</tbody></table></div>`
 :UI.setTab==='access'?`<div class="help">${ic('shield-check')}<div>Tick what each role can open. Try it: click your name at the top-right and choose “View the app as…”.</div></div><div class="card tw"><table class="matrix"><thead><tr><th>Menu</th>${Object.keys(ROLES).map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${MODS.map(m=>`<tr><td><div class="who"><span class="ico" style="background:${m[3]}22;color:${m[3]}">${ic(m[2])}</span><span class="lbl">${m[1]}</span></div></td>${Object.keys(ROLES).map(r=>`<td><input type="checkbox" ${S.perms[r].includes(m[0])?'checked':''} ${r==='Admin'||m[0]==='home'?'disabled':''} onchange="togglePerm('${r}','${m[0]}',this.checked)"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`
 :`<div class="card"><div class="card-b"><div class="timeline">${S.audit.map(e=>`<div class="ev">${esc(e.msg)}<small>${esc(e.by)} · ${fmtDT(e.at)}</small></div>`).join('')}</div></div></div>`);
function togglePerm(r,m,on){const p=S.perms[r];if(on&&!p.includes(m))p.push(m);if(!on)S.perms[r]=p.filter(x=>x!==m);save();renderNav();toast('Access updated')}
function editUser(id){const u=S.users.find(x=>x.id===id)||{role:'Supervisor',cat:'',active:true};openModal(id?'Edit User':'Create User',`<div class="form"><div class="fld"><label>Name <em>*</em></label><input class="inp" id="u_name" value="${esc(u.name||'')}"></div><div class="fld"><label>Mobile</label><input class="inp" id="u_mob" value="${esc(u.mobile||'')}"></div>
  <div class="fld"><label>Email</label><input class="inp" id="u_mail" value="${esc(u.email||'')}"></div><div class="fld"><label>Role</label><select class="sel" id="u_role">${Object.keys(ROLES).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
  <div class="fld"><label>Category (optional)</label><select class="sel" id="u_cat"><option value="">All</option>${CATS.map(c=>`<option ${u.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <label class="check" style="align-self:end"><input type="checkbox" id="u_act" ${u.active?'checked':''}>Active (can log in)</label>
  <div class="full help warn">${ic('lock')}<div>In the real app the user sets their own password on first login. This demo does not store passwords.</div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveUser('${id||''}')">${ic('check')}Save</button>`)}
function saveUser(id){const name=val('u_name');if(!name)return toast('Enter name','alert-circle');const d={name,mobile:val('u_mob'),email:val('u_mail'),role:val('u_role'),cat:val('u_cat'),active:$('#u_act').checked};if(id)Object.assign(S.users.find(x=>x.id===id),d);else{S.users.push({id:'U'+(S.seq.user++),...d});audit(`User ${name} created (${d.role})`)}save();closeModal();rerender();toast('User saved')}

/* =========================================================
   PRINT (quotation / invoice / receipt / cutting list)
   ========================================================= */
function printDoc(kind,id){let body='',ttl='';const css=`.docp{font-size:13px;color:#1E2433;border:1px solid #E3E7EF;border-radius:10px;padding:24px;background:#fff}.docp h1{margin:0;color:#C8102E;font-size:20px}.docp table{width:100%;border-collapse:collapse;margin-top:14px}.docp th,.docp td{border:1px solid #D9DEE8;padding:8px;text-align:left;white-space:normal}.docp th{background:#F3F5FA;color:#3B4256}.docp .r{text-align:right}.docp .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid #C8102E;padding-bottom:12px;margin-bottom:16px}.docp .tot{width:300px;max-width:100%;margin-left:auto}.docp .tot td{border:0;padding:4px 8px}.docp .g{font-weight:800;font-size:16px;border-top:2px solid #1E2433!important}.docp pre{font-family:inherit;white-space:pre-wrap;background:#F8F9FC;padding:12px;border-radius:8px}`;
  const hdr=(t,no,date)=>`<div class="hd"><div><h1>SRI VINAYAKA WOOD INDUSTRIES</h1><div>Palakkad, Kerala · 94463 04888, 85938 25777</div></div><div style="text-align:right"><b style="font-size:18px">${t}</b><div>${no}</div><div>${fmtD(date)}</div></div></div>`;
  const lines=d=>`<table><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Disc</th><th class="r">Amount</th></tr>${d.lines.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b><br><small>${esc(l.desc||'')}</small></td><td class="r">${l.qty} ${l.unit||''}</td><td class="r">${inr(l.rate,1)}</td><td class="r">${l.disc||0}%</td><td class="r">${inr(lineAmt(l),1)}</td></tr>`).join('')}${(d.charges||[]).map(c=>`<tr><td></td><td colspan="4">${esc(c.label)}</td><td class="r">${inr(c.amount,1)}</td></tr>`).join('')}</table>`;
  const tots=(d,extra='')=>{const t=totals(d);return`<table class="tot"><tr><td>Subtotal</td><td class="r">${inr(t.sub,1)}</td></tr>${t.disc?`<tr><td>Discount</td><td class="r">−${inr(t.disc,1)}</td></tr>`:''}${t.tax?`<tr><td>Tax</td><td class="r">${inr(t.tax,1)}</td></tr>`:''}<tr><td class="g">Grand total</td><td class="r g">${inr(t.total,1)}</td></tr>${extra}</table>`};
  if(kind==='quote'){const q=S.quotations.find(x=>x.id===id);ttl=q.id;body=hdr('QUOTATION',q.id,q.at)+`<p><b>To:</b> ${esc(q.cust)}${q.company?', '+esc(q.company):''}<br>${esc(q.address||'')} ${esc(q.mobile||'')}</p>`+lines(q)+tots(q)+`<h3>Terms</h3><pre>${esc(q.notes||'')}</pre><p>We trust our offer would meet with your favour and look forward to hearing from you.<br><br>Thanking you,<br><b>SRI VINAYAKA WOOD INDUSTRIES</b></p>`}
  if(kind==='invoice'){const o=order(id),p=paidOf(id);ttl='INV-'+o.id.slice(3);body=hdr('INVOICE',ttl,o.date)+`<p><b>Bill to:</b> ${esc(o.cust)}<br>${esc(o.address||'')} ${esc(o.mobile||'')}<br><b>Order:</b> ${o.id}</p>`+lines(o)+tots(o,`<tr><td>Paid</td><td class="r">${inr(p,1)}</td></tr><tr><td class="g">Balance due</td><td class="r g">${inr(total(o)-p,1)}</td></tr>`)}
  if(kind==='receipt'){const p=S.payments.find(x=>x.id===id),o=order(p.order);ttl=p.id;body=hdr('PAYMENT RECEIPT',p.id,p.at)+`<p>Received with thanks from <b>${esc(o.cust)}</b> the sum of <b>${inr(p.amount,1)}</b> via <b>${p.mode}</b> towards order <b>${o.id}</b>.</p><p>Balance remaining: <b>${inr(total(o)-paidOf(o.id),1)}</b></p><br><p>Authorised signature</p>`}
  if(kind==='cut'){const j=job(id),o=order(j.order);ttl='Cutting '+j.id;body=hdr('CUTTING LIST',j.id,todayISO())+`<p><b>Order:</b> ${o.id} · ${esc(o.cust)} · Delivery by ${fmtD(o.expected)}</p><table><tr><th>Product</th><th>Piece</th><th>Material</th><th>L (ft)</th><th>W (in)</th><th>T (in)</th><th class="r">Qty</th><th class="r">cft</th></tr>${j.cut.map(c=>`<tr><td>${esc(c.item)}</td><td>${esc(c.piece)}</td><td>${esc(mat(c.mat)?.name)}</td><td>${c.L}</td><td>${c.W}</td><td>${c.T}</td><td class="r">${c.qty*lineQty(j,c.item)}</td><td class="r">${(cft(c)*lineQty(j,c.item)).toFixed(4)}</td></tr>`).join('')||'<tr><td colspan="8">No pieces</td></tr>'}</table>`}
  openModal(esc(ttl)+' <span class="pill p-gray">Preview</span>',`<style>${css}</style><div class="tw"><div class="docp">${body}</div></div><div class="small muted" style="margin-top:10px">In the real app this downloads as a PDF to print or send on WhatsApp.</div>`,`<button class="btn pri" onclick="closeModal()">Close</button>`,'wide')}

/* =========================================================
   GUIDE
   ========================================================= */
function showGuide(){openModal('How to use this app – 5 simple steps',`<div class="grid" style="gap:10px">${[
  ['target','#F43F5E','1. Lead','Someone calls or visits? Click <b>Create → New Lead</b>. Type name, mobile, place. Done.'],
  ['file-text','#F59E0B','2. Quotation','In Leads, click <b>Make Quotation</b>. Pick items – price fills itself. Print and give to customer.'],
  ['shopping-cart','#22C55E','3. Order','Customer agrees? Open the quotation, click <b>Customer agreed</b>, then <b>Make Order</b>. Enter advance if paid.'],
  ['hammer','#F97316','4. Workshop','Go to <b>All Jobs</b>. Open the job, click <b>Move to …</b> as each step finishes. At QC, tick the checklist.'],
  ['indian-rupee','#10B981','5. Payment','When money comes, click <b>Record Payment</b>. Balance updates automatically. Mark delivered when it leaves.']
 ].map(s=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px"><span class="ico" style="width:36px;height:36px;background:${s[1]}22;color:${s[1]}">${ic(s[0])}</span><div><b>${s[2]}</b><div class="small" style="margin-top:2px">${s[3]}</div></div></div>`).join('')}
 <div class="help good" style="margin:6px 0 0">${ic('sparkles')}<div>Daily: mark <b>Attendance</b> in the morning. Monthly: check <b>Payroll</b>. Everything else shows up in <b>My tasks for today</b> on Home.</div></div></div>`,`<button class="btn pri" onclick="closeModal()">Got it!</button>`)}

/* =========================================================
   SIDEBAR + THEME
   ========================================================= */
function toggleSide(){if(innerWidth<=900){document.body.classList.toggle('navopen');return}
  const c=document.body.classList.toggle('collapsed');try{localStorage.setItem('svw_side',c?'collapsed':'open')}catch(e){}}
const effTheme=()=>document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function paintThemeBtn(){const b=document.getElementById('themeBtn');if(!b)return;const d=effTheme()==='dark';b.innerHTML=ic(d?'sun':'moon');b.title=d?'Switch to light mode':'Switch to dark mode';lucide.createIcons()}
function toggleTheme(){const n=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('svw_theme',n)}catch(e){}paintThemeBtn();toast(n==='dark'?'Dark mode on':'Light mode on',n==='dark'?'moon':'sun')}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',paintThemeBtn);
addEventListener('resize',()=>{if(innerWidth>900)document.body.classList.remove('navopen')});

/* =========================================================
   BOOT
   ========================================================= */
if(document.documentElement.classList.contains('pre-collapsed'))document.body.classList.add('collapsed');
route();paintThemeBtn();
</script>
