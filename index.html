<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Demo of the Sri Vinayaka Wood Industries operations portal – leads, quotations, orders, workshop, stock, billing and payroll.">
<meta name="theme-color" content="#1D2840">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("svw_theme");if(t)document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem("svw_side")==="collapsed")document.documentElement.classList.add("pre-collapsed")}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231D2840'/%3E%3Cpath d='M27 12c-2-2-5-3-8-2-4 1-5 5-2 7l6 3c3 2 2 6-2 7-3 1-6 0-8-2' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Sri Vinayaka Operations Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
/* Zoho-style shell: navy sidebar + soft grey-blue canvas + white cards. Light and dark themes. */
:root{
  --side:#1D2840;--side2:#2A3754;--side-on:#34436A;--side-ink:#C7D0E3;--side-mute:#8592AD;
  --bg:#EDF0F7;--card:#fff;--ink:#1E2433;--ink2:#3B4256;--muted:#6B7385;--line:#E3E7EF;--line2:#F2F4F9;
  --thbg:#FAFBFD;--hover:#F6F8FD;--kcol:#E4E8F2;--topbg:rgba(237,240,247,.92);
  --pri:#2F5BEA;--pri-d:#2447C5;--pri-s:#E9EFFF;
  --green:#16A34A;--green-s:#E5F6EC;--green-m:#B7E4C7;--red:#DC2626;--red-s:#FDECEC;--red-b:#F5C2C2;--amber:#D97706;--amber-s:#FEF3E2;
  --violet:#7C3AED;--violet-s:#F1EAFF;--teal:#0D9488;--teal-s:#E3F5F3;--gray-s:#EEF0F4;
  --help-ink:#1E3A8A;--warn-ink:#92400E;--bad-ink:#991B1B;--good-ink:#14532D;--good-b:#B5E3C6;
  --r:12px;--shadow:0 1px 2px rgba(20,30,60,.04),0 2px 8px rgba(20,30,60,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side:#0B1120;--side2:#1A2338;--side-on:#26345A;--side-ink:#B9C3D8;--side-mute:#7581A0;
  --bg:#0F1524;--card:#171F31;--ink:#E7EBF3;--ink2:#C3CADA;--muted:#8E97AB;--line:#28324A;--line2:#1E2739;
  --thbg:#1A2336;--hover:#1C2539;--kcol:#121A2B;--topbg:rgba(15,21,36,.9);
  --pri:#6B8BFF;--pri-d:#5677F5;--pri-s:#1E2A4F;
  --green:#34D399;--green-s:#11301F;--green-m:#1F5A3A;--red:#F87171;--red-s:#3A1B1E;--red-b:#6B2A2E;--amber:#FBBF24;--amber-s:#382A12;
  --violet:#A78BFA;--violet-s:#2A2047;--teal:#2DD4BF;--teal-s:#0F302C;--gray-s:#263046;
  --help-ink:#BFD0FF;--warn-ink:#FCD9A0;--bad-ink:#FCA5A5;--good-ink:#A7F3D0;--good-b:#1F5A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#0B1120;--side2:#1A2338;--side-on:#26345A;--side-ink:#B9C3D8;--side-mute:#7581A0;
  --bg:#0F1524;--card:#171F31;--ink:#E7EBF3;--ink2:#C3CADA;--muted:#8E97AB;--line:#28324A;--line2:#1E2739;
  --thbg:#1A2336;--hover:#1C2539;--kcol:#121A2B;--topbg:rgba(15,21,36,.9);
  --pri:#6B8BFF;--pri-d:#5677F5;--pri-s:#1E2A4F;
  --green:#34D399;--green-s:#11301F;--green-m:#1F5A3A;--red:#F87171;--red-s:#3A1B1E;--red-b:#6B2A2E;--amber:#FBBF24;--amber-s:#382A12;
  --violet:#A78BFA;--violet-s:#2A2047;--teal:#2DD4BF;--teal-s:#0F302C;--gray-s:#263046;
  --help-ink:#BFD0FF;--warn-ink:#FCD9A0;--bad-ink:#FCA5A5;--good-ink:#A7F3D0;--good-b:#1F5A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none}
a{color:inherit;text-decoration:none}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#3a4766 transparent}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo b{color:#fff;font-size:15px;font-weight:800;letter-spacing:.2px}
.logo small{display:block;color:var(--side-mute);font-size:11px;font-weight:500}
.sfind{margin:4px 14px 10px;position:relative}
.sfind input{width:100%;height:36px;border-radius:9px;border:1px solid #33405e;background:#17213A;color:#fff;padding:0 10px 0 34px;outline:none;font-size:13px}
.sfind input::placeholder{color:var(--side-mute)}
.sfind svg{position:absolute;left:10px;top:9px;color:var(--side-mute);width:16px;height:16px}
.nav{padding:0 10px 16px;flex:1}
.nav .grp{margin-top:6px}
.nav .gh{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;user-select:none}
@media (hover:hover){.nav .gh:hover{background:var(--side2)}}
.nav .gh .chev{margin-left:auto;width:15px;height:15px;color:var(--side-mute);transition:.15s}
.nav .grp.closed .chev{transform:rotate(-90deg)}
.nav .grp.closed .items{display:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--side-ink);margin:1px 0}
@media (hover:hover){.nav a:hover{background:var(--side2);color:#fff}}
.nav a.on{background:var(--side-on);color:#fff;font-weight:600}
.nav a .cnt{margin-left:auto;background:#E5484D;color:#fff;font-size:10.5px;border-radius:20px;padding:1px 7px;font-weight:700}
.nav a.toplink{padding-left:10px;color:#fff;font-weight:600}
.ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.ico svg{width:15px;height:15px}
.side-foot{margin:10px 14px 16px;padding:12px;border-radius:12px;background:#253150;font-size:12px;color:var(--side-ink)}
.side-foot b{color:#fff;display:block;margin-bottom:3px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(8px);height:64px;display:flex;align-items:center;gap:12px;padding:0 28px}
.top .burger{display:none}
.gsearch{flex:1;max-width:460px;position:relative}
.gsearch input{width:100%;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px 0 40px;outline:none}
.gsearch input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.gsearch>svg{position:absolute;left:13px;top:11px;color:var(--muted)}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(20,30,60,.14);padding:6px;display:none;max-height:360px;overflow:auto}
.sres.show{display:block}
.sres .r{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.sres .r:hover{background:var(--line2)}
.top .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.ibtn:hover{background:var(--line2)}
.ibtn .dot{position:absolute;top:-5px;right:-5px;background:#E5484D;color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:grid;place-items:center;border:2px solid var(--bg)}
.dd{position:absolute;right:0;top:48px;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(20,30,60,.14);padding:6px;display:none;z-index:30}
.dd.show{display:block}
.dd .di{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.dd .di:hover{background:var(--line2)}
.dd h6{margin:6px 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.me{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 6px 4px 4px;border-radius:12px;position:relative}
.me:hover{background:var(--card)}
.me b{font-size:13px;display:block}
.me small{font-size:11.5px;color:var(--muted)}

.view{padding:8px 28px 40px;max-width:1400px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.ph p{margin:4px 0 0;color:var(--muted);max-width:640px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.crumb a{color:var(--pri);font-weight:600}

/* ===== atoms ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--card);border-color:var(--red-b);color:var(--red)}
.btn.red:hover{background:var(--red-s)}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 0}
.card-h h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.mb{margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-blue{background:var(--pri-s);color:var(--pri)} .p-green{background:var(--green-s);color:var(--green)} .p-red{background:var(--red-s);color:var(--red)}
.p-amber{background:var(--amber-s);color:var(--amber)} .p-violet{background:var(--violet-s);color:var(--violet)} .p-teal{background:var(--teal-s);color:var(--teal)} .p-gray{background:var(--gray-s);color:var(--ink2)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;color:var(--ink2)}
.link{color:var(--pri);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)} .small{font-size:12.5px}
.right{text-align:right} .tnum{font-variant-numeric:tabular-nums}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-amber{color:var(--amber)} .b{font-weight:700}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.av.lg{width:52px;height:52px;font-size:18px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:12px}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--pri-s);color:var(--help-ink);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px}
.help svg{color:var(--pri);margin-top:1px}
.warn{background:var(--amber-s);color:var(--warn-ink)}.warn svg{color:var(--amber)}
.bad{background:var(--red-s);color:var(--bad-ink)}.bad svg{color:var(--red)}
.good{background:var(--green-s);color:var(--good-ink)}.good svg{color:var(--green)}

/* tabs / seg */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--pri-s);color:var(--pri)}

/* filters / table */
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:center}
.fsearch{position:relative;flex:1;min-width:200px}
.fsearch input{width:100%;padding-left:36px}
.fsearch svg{position:absolute;left:11px;top:11px;color:var(--muted);width:16px;height:16px}
.inp,.sel{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:var(--card);outline:none;min-width:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--thbg)}
td{padding:12px 16px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
td.wrap{white-space:normal;min-width:220px}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);color:var(--muted);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:#B8C0D2;margin-bottom:6px}

/* dashboard */
.welcome{display:flex;align-items:center;gap:16px;padding:20px}
.welcome .hi{font-size:12.5px;color:var(--muted)}
.welcome h2{margin:2px 0 0;font-size:20px;font-weight:700}
.welcome .stat{margin-left:auto;text-align:right}
.welcome .stat .v{font-size:24px;font-weight:800}
.kpi{padding:16px 18px;cursor:pointer;transition:.12s}
.kpi:hover{box-shadow:0 8px 24px rgba(20,30,60,.08)}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:23px;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.up{color:var(--green);font-weight:700}
.target .tr{height:30px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:12px;position:relative}
.target .tr i{position:absolute;inset:0 auto 0 0;background:var(--green-m);border-right:3px solid var(--ink)}
.target .tr span{position:absolute;left:10px;top:6px;font-weight:700;font-size:13px}
.tasks td{padding:11px 18px}
.tasks td:first-child{white-space:normal;min-width:200px}
.welcome{flex-wrap:wrap}
.funnel .row{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--ink2)}
.funnel .tr{height:26px;background:var(--line2);border-radius:6px;overflow:hidden}
.funnel .tr i{display:block;height:100%;border-radius:6px;transition:width .4s}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto}
.stagebar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line2);margin:8px 0 14px}
.stagebar i{display:block;height:100%}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.s5{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;cursor:pointer}
.s5:hover{border-color:var(--pri)}
.s5 .n{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;margin-bottom:8px}
.s5 b{display:block;font-size:13.5px}
.s5 small{color:var(--muted);font-size:12px}

/* kanban */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:270px;width:270px;flex:none;background:var(--kcol);border-radius:12px;overflow:hidden}
.kh{padding:12px 14px;border-top:4px solid}
.kh .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.kh .t span{background:rgba(0,0,0,.12);border-radius:6px;padding:0 7px;font-size:12px}
.kh .a{font-weight:800;font-size:14px;margin-top:3px}
.kbody{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kc{background:var(--card);border-radius:9px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border:1px solid transparent}
.kc:hover{border-color:var(--pri)}
.kc .t{font-weight:700;font-size:13.5px}
.kc .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.kc .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ghost-row{height:10px;background:var(--line2);border-radius:6px;margin:6px 0}

/* progress / steps */
.prog{height:7px;background:var(--line2);border-radius:20px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track{display:flex;gap:4px;flex-wrap:wrap}
.track span{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--line2);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.track span.done{background:var(--green-s);color:var(--green)}
.track span.cur{background:var(--pri);color:#fff}
.track svg{width:12px;height:12px}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--green)} .dots i.c{background:var(--pri)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld label em{color:var(--red);font-style:normal}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.fld .inp,.fld .sel{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{cursor:pointer}
.chips input{display:none}
.chips span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);font-weight:500;font-size:13px;background:var(--card)}

/* attendance */
.att{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}

.att button:first-child{border-left:0}
.att button.A{background:var(--red-s);color:var(--red)}
.att button.H{background:var(--amber-s);color:var(--amber)}
.att button.P{background:var(--green-s);color:var(--green)}
.reg td{padding:6px 4px;text-align:center;font-size:11px}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

const lineAmt=l=>l.qty*l.rate*(1-(l.disc||0)/100);
function totals(doc){const sub=doc.lines.reduce((a,l)=>a+lineAmt(l),0)+(doc.charges||[]).reduce((a,c)=>a+(+c.amount||0),0);const disc=sub*(doc.discPct||0)/100;const tax=(sub-disc)*(doc.taxPct||0)/100;return{sub,disc,tax,total:sub-disc+tax}}
const total=doc=>totals(doc).total;
const paidOf=id=>S.payments.filter(p=>p.order===id).reduce((a,p)=>a+p.amount,0);
const order=id=>S.orders.find(o=>o.id===id);

const job=id=>S.jobs.find(j=>j.id===id);

const DONE=()=>S.template.length-1;
const cft=p=>p.L*(p.W/12)*(p.T/12)*p.qty;

function jobStatus(j){if(j.items.every(i=>i.stage>=DONE()))return'Completed';if(j.items.some(i=>i.stage>0))return'In Progress';return'Not Started'}
function jobDue(j){const o=order(j.order);if(!o||jobStatus(j)==='Completed')return null;const d=daysBetween(todayISO(),o.expected);return d}
function orderStatus(o){if(o.delivered)return'Delivered';const j=jobOfOrder(o.id);if(!j)return'Confirmed';const s=jobStatus(j);if(s==='Completed')return'Ready for Delivery';return'In Production'}

function resetDemo(){ask('Reset all demo data to the starting point? Your changes will be removed.',()=>{try{localStorage.removeItem(LS)}catch(e){}S=seed();save();render();toast('Demo data reset','rotate-ccw')},'Reset')}
/* in-page replacements for confirm()/prompt() (blocked in the shared viewer) */
let _askFn=null,_inFn=null;
function ask(msg,fn,yes='Yes, delete'){_askFn=fn;openModal('Please confirm',`<div class="help warn">${ic('alert-triangle')}<div>${esc(msg)}</div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="closeModal();_askFn&&_askFn()">${yes}</button>`)}
function askInput(t,label,v,fn,type='text'){_inFn=fn;openModal(t,`<div class="fld"><label>${label}</label><input class="inp" id="ai_v" type="${type}" style="width:100%" value="${esc(v??'')}"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="const v=val('ai_v');if(!v)return;closeModal();_inFn(v)">${ic('check')}Save</button>`);setTimeout(()=>$('#ai_v')?.focus(),50)}
function nav(h){const p=String(h).replace(/^#/,'').split('/');UI.route=p[0]||'home';UI.param=p[1]||'';try{history.replaceState(null,'','#'+UI.route)}catch(e){}render()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();nav(a.getAttribute('href'))}},true);
function globalSearch(q){const box=$('#sres');q=q.trim().toLowerCase();if(!q){box.classList.remove('show');return}
  const r=[];S.leads.forEach(l=>{if([l.name,l.mobile,l.id].join(' ').toLowerCase().includes(q))r.push(['target','Lead',l.name,l.id,`#leads`])});
  S.customers.forEach(c=>{if([c.name,c.mobile,c.id].join(' ').toLowerCase().includes(q))r.push(['users','Customer',c.name,c.id,'#customers'])});
  S.quotations.forEach(x=>{if([x.cust,x.id].join(' ').toLowerCase().includes(q))r.push(['file-text','Quotation',x.cust,x.id,'#quotations'])});
  S.orders.forEach(o=>{if([o.cust,o.id,o.mobile].join(' ').toLowerCase().includes(q))r.push(['shopping-cart','Order',o.cust,o.id,`javascript:viewOrder('${o.id}')`])});
  S.jobs.forEach(j=>{if([j.id,j.order,order(j.order).cust].join(' ').toLowerCase().includes(q))r.push(['hammer','Job',order(j.order).cust,j.id,`#job/${j.id}`])});
  box.innerHTML=r.slice(0,10).map(x=>`<div class="r" onclick="${x[4].startsWith('javascript:')?x[4].slice(11):`nav('${x[4]}')`};$('#sres').classList.remove('show')">${ic(x[0],'color:var(--pri)')}<div><b>${esc(x[2])}</b><div class="small muted">${x[1]} · ${x[3]}</div></div></div>`).join('')||'<div class="empty">Nothing found</div>';box.classList.add('show');lucide.createIcons()}
window.addEventListener('hashchange',route);
function route(){const h=(location.hash.slice(1)||'home').split('/');UI.route=h[0];UI.param=h[1]||'';render()}
function render(){const key=UI.route==='job'?'jobs':UI.route;if(!PAGES[UI.route]||!allowed().includes(key)){UI.route='home'}renderNav();$('#view').innerHTML=PAGES[UI.route]();lucide.createIcons();window.scrollTo(0,0)}
function rerender(){renderNav();$('#view').innerHTML=PAGES[UI.route]();lucide.createIcons()}
const head=(t,p,acts='',icon)=>`<div class="ph"><div><h1>${icon?`<span class="ico" style="width:34px;height:34px;background:${icon[1]}22;color:${icon[1]}">${ic(icon[0])}</span>`:''}${t}</h1><p>${p}</p></div><div class="acts">${acts}</div></div>`;
const modHead=(key,p,acts)=>{const m=MODS.find(x=>x[0]===key);return head(m[1],p,acts,[m[2],m[3]])};
const tabs=(key,list)=>`<div class="tabs">${list.map(([k,l])=>`<button class="${UI[key]===k?'on':''}" onclick="UI.${key}='${k}';rerender()">${l}</button>`).join('')}</div>`;
const seg=(key,list,cb='rerender()')=>`<div class="seg">${list.map(([k,l])=>`<button class="${String(UI[key])===String(k)?'on':''}" onclick="UI.${key}=${typeof k==='boolean'?k:`'${k}'`};${cb}">${l}</button>`).join('')}</div>`;
const fsearch=(key,ph,body)=>`<div class="fsearch">${ic('search')}<input class="inp" placeholder="${ph}" value="${esc(UI[key])}" oninput="UI.${key}=this.value;document.getElementById('${body}').innerHTML=${body}();lucide.createIcons()"></div>`;
const fsel=(key,label,opts,body)=>`<select class="sel" onchange="UI.${key}=this.value;document.getElementById('${body}').innerHTML=${body}();lucide.createIcons()"><option value="">${label}</option>${opts.map(o=>`<option ${UI[key]===o?'selected':''}>${o}</option>`).join('')}</select>`;
const emptyRow=(cols,msg,icon='inbox')=>`<tr><td colspan="${cols}"><div class="empty">${ic(icon)}<div>${msg}</div></div></td></tr>`;

/* =========================================================
   PAGES
   ========================================================= */
const PAGES={};

/* ---------- HOME (Zoho-style dashboard) ---------- */
PAGES.home=()=>{
  const t=todayISO(),mon=t.slice(0,7),al=allowed();
  const inPeriod=iso=>{if(UI.period==='month')return iso.slice(0,7)===mon;return daysBetween(iso.slice(0,10),t)<+UI.period};
  const f=[['Leads',S.leads.filter(l=>inPeriod(l.date)).length,'#F43F5E'],['Quotations',S.quotations.filter(q=>inPeriod(q.at)).length,'#F59E0B'],['Approved',S.quotations.filter(q=>inPeriod(q.at)&&['Approved','Converted'].includes(q.status)).length,'#22C55E'],['Orders',S.orders.filter(o=>inPeriod(o.date)).length,'#3B82F6']];
  const fmx=Math.max(1,...f.map(x=>x[1]));
  const salesMonth=S.orders.filter(o=>o.date.slice(0,7)===mon).reduce((a,o)=>a+total(o),0);
  const recvMonth=S.payments.filter(p=>p.at.slice(0,7)===mon).reduce((a,p)=>a+p.amount,0);
  const balance=S.orders.filter(o=>!o.delivered||true).reduce((a,o)=>a+total(o)-paidOf(o.id),0);
  const running=S.jobs.filter(j=>jobStatus(j)!=='Completed');
  const late=running.filter(j=>jobDue(j)<0);
  const src={};S.leads.forEach(l=>src[l.source]=(src[l.source]||0)+1);
  const srcCol={'Walk-in':'#3B82F6','Phone':'#14B8A6','WhatsApp':'#22C55E','Website':'#6366F1','Social Media':'#EC4899','Referral':'#F59E0B','Other':'#94A3B8'};
  const totalLeads=S.leads.length;let acc=0;const R=52,C=2*Math.PI*R;
  const arcs=Object.entries(src).map(([k,v])=>{const len=v/totalLeads*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${srcCol[k]||'#94A3B8'}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s}).join('');
  // tasks
  const tasks=[];
  late.forEach(j=>tasks.push([`Job ${j.id} is late – ${order(j.order).cust}`,fmtD(order(j.order).expected),'Overdue','High',`nav('job/${j.id}')`,'jobs']));
  running.filter(j=>{const d=jobDue(j);return d>=0&&d<=5}).forEach(j=>tasks.push([`Finish job ${j.id} – ${order(j.order).cust}`,fmtD(order(j.order).expected),'Due soon','High',`nav('job/${j.id}')`,'jobs']));
  S.quotations.filter(q=>q.status==='Approved').forEach(q=>tasks.push([`Convert ${q.id} (${q.cust}) to order`,'Today','Waiting','Medium',`nav('quotations')`,'quotations']));
  S.leads.filter(l=>l.status==='Open').forEach(l=>tasks.push([`Call ${l.name} about ${l.req||'enquiry'}`,'Today','Open','Medium',`nav('leads')`,'leads']));
  if(!S.att[t]||!Object.keys(S.att[t]).length)tasks.push(['Mark today\'s attendance','Today','Not done','Medium',`nav('attendance')`,'attendance']);
  lowStock().slice(0,2).forEach(m=>tasks.push([`Buy more ${m.name} (${m.stock} ${m.unit} left)`,'This week','Low stock','Low',`nav('materials')`,'materials']));
  const tv=tasks.filter(x=>al.includes(x[5]));
  const prCls={High:'p-red',Medium:'p-amber',Low:'p-gray'};
  const hr=new Date().getHours();const greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const stageCount={};S.jobs.forEach(j=>j.items.forEach(i=>{const n=S.template[i.stage];stageCount[n]=(stageCount[n]||0)+1}));const itemsTotal=Object.values(stageCount).reduce((a,b)=>a+b,0)||1;
  const kpi=(l,v,s,go,icon,col)=>`<div class="card kpi" onclick="${al.includes(go)?`nav('${go}')`:''}"><div style="display:flex;justify-content:space-between"><div class="l">${l}</div><span class="ico" style="background:${col}1F;color:${col}">${ic(icon)}</span></div><div class="v tnum">${v}</div><div class="s">${s}</div></div>`;
  return `
  ${!S.guideHidden?`<div class="card mb" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><b style="font-size:15px">New here? This is how work flows 👇</b><div class="small muted">Click any step to open it. You can hide this box anytime.</div></div><button class="btn sm ghost" onclick="S.guideHidden=true;save();rerender()">${ic('x')}Hide</button></div>
    <div class="steps5">${[['Lead','Note the enquiry','leads'],['Quotation','Send the price','quotations'],['Order','Customer says yes','orders'],['Production','Make it in the workshop','jobs'],['Payment','Collect the balance','billing']].map((s,i)=>`<div class="s5" onclick="nav('${s[2]}')"><div class="n">${i+1}</div><b>${s[0]}</b><small>${s[1]}</small></div>`).join('')}</div></div>`:''}
  <div class="grid g-1-2 mb">
    <div class="card welcome">${av(ROLES[S.role],'lg')}<div><div class="hi">${greet}! 👋</div><h2>${esc(ROLES[S.role])}</h2><div class="small muted">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div>
      <div class="stat"><div class="small muted">Orders this month</div><div class="v">${S.orders.filter(o=>o.date.slice(0,7)===mon).length}</div><div class="small"><span class="up">▲</span> <span class="muted">${S.quotations.filter(q=>q.at.slice(0,7)===mon).length} quotations</span></div></div></div>
    <div class="card"><div class="card-h"><h3>My tasks for today</h3><span class="sub">${tv.length} things to do</span></div>
      <div class="tw" style="max-height:208px;overflow:auto;margin-top:8px"><table class="tasks"><thead><tr><th>What to do</th><th>Due</th><th>Status</th><th>Priority</th></tr></thead><tbody>
      ${tv.map(x=>`<tr class="click" onclick="${x[4]}"><td class="b">${esc(x[0])}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill ${prCls[x[3]]}">${x[3]}</span></td></tr>`).join('')||emptyRow(4,'Nothing pending. Great job! 🎉','party-popper')}</tbody></table></div></div>
  </div>
  <div class="grid g4 mb">
    ${kpi('Sales this month',inr(salesMonth),`<span class="up">▲</span> ${S.orders.filter(o=>o.date.slice(0,7)===mon).length} orders booked`,'orders','trending-up','#3B82F6')}
    ${kpi('Money received',inr(recvMonth),`${S.payments.filter(p=>p.at.slice(0,7)===mon).length} payment(s) this month`,'billing','wallet','#16A34A')}
    ${kpi('Balance to collect',inr(balance),'From all running orders','billing','hand-coins','#F59E0B')}
    ${kpi('Jobs in workshop',running.length,late.length?`<span class="c-red b">${late.length} late</span> · ${running.length-late.length} on time`:'All on time','jobs','hammer','#F97316')}
  </div>
  <div class="grid g-2-1 mb">
    <div class="card"><div class="card-h"><h3>Enquiry to order</h3>${seg('period',[['7','7 days'],['30','30 days'],['90','90 days'],['month','This month']])}</div>
      <div class="card-b funnel">${f.map(x=>`<div class="row"><span>${x[0]}</span><div class="tr"><i style="width:${x[1]/fmx*100}%;background:${x[2]}"></i></div><b class="tnum">${x[1]}</b></div>`).join('')}
      <div class="small muted">Out of every ${f[0][1]||0} enquiries, ${f[3][1]} became orders in this period.</div></div></div>
    <div class="card target"><div class="card-h"><h3>Sales target – this month</h3><button class="btn sm ghost" onclick="askInput('Sales target','Monthly sales target (₹)',S.target,v=>{S.target=+v||S.target;save();rerender()},'number')">${ic('pencil')}Edit</button></div>
      <div class="card-b"><div class="small muted">Target: ${inr(S.target)}</div><div class="tr"><i style="width:${Math.min(100,salesMonth/S.target*100)}%"></i><span>${inr(salesMonth)}</span></div>
      <div class="small" style="margin-top:10px"><b>${Math.round(salesMonth/S.target*100)}%</b> <span class="muted">done · ${inr(Math.max(0,S.target-salesMonth))} more to reach target</span></div></div></div>
  </div>
  <div class="grid g3 mb">
    <div class="card"><div class="card-h"><h3>Leads by source</h3><a class="link small" href="#leads">View leads</a></div><div class="card-b donut-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">${arcs}<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="800" style="fill:var(--ink)">${totalLeads}</text><text x="70" y="84" text-anchor="middle" font-size="11" style="fill:var(--muted)">leads</text></svg>
      <div class="legend">${Object.entries(src).map(([k,v])=>`<div><i style="background:${srcCol[k]}"></i>${k}<b>${v} (${Math.round(v/totalLeads*100)}%)</b></div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Workshop status</h3><a class="link small" href="#jobs">Open jobs</a></div><div class="card-b">
      <div class="small muted">${itemsTotal} products being made</div>
      <div class="stagebar">${Object.entries(stageCount).map(([k,v])=>`<i title="${k}: ${v}" style="width:${v/itemsTotal*100}%;background:${stageColor(k)}"></i>`).join('')}</div>
      <div class="legend">${Object.entries(stageCount).map(([k,v])=>`<div><i style="background:${stageColor(k)}"></i>${k}<b>${v}</b></div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Needs attention</h3></div><div class="card-b">
      ${late.map(j=>`<div class="help bad" style="margin-bottom:8px;cursor:pointer" onclick="nav('job/${j.id}')">${ic('alarm-clock')}<div><b>${j.id}</b> is late by ${-jobDue(j)} days<br><span class="small">${esc(order(j.order).cust)} · ${order(j.order).id}</span></div></div>`).join('')}
      ${lowStock().slice(0,3).map(m=>`<div class="help warn" style="margin-bottom:8px">${ic('package')}<div>Low stock: <b>${esc(m.name)}</b> – ${m.stock} ${m.unit} left</div></div>`).join('')}
      ${!late.length&&!lowStock().length?`<div class="help good">${ic('check-circle-2')}Everything looks fine today.</div>`:''}</div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Recent orders</h3><a class="link small" href="#orders">See all orders</a></div><div class="tw" style="margin-top:8px"><table><thead><tr><th>Customer</th><th>Order</th><th class="right">Total</th><th class="right">Balance</th><th>Status</th><th>Delivery date</th></tr></thead><tbody>
    ${S.orders.slice(0,5).map(o=>`<tr class="click" onclick="viewOrder('${o.id}')"><td><div class="who">${av(o.cust)}<div><b>${esc(o.cust)}</b><small>${o.cat}</small></div></div></td><td class="code">${o.id}</td><td class="right tnum b">${inr(total(o))}</td><td class="right tnum c-amber b">${inr(total(o)-paidOf(o.id))}</td><td>${pill(orderStatus(o))}</td><td>${fmtD(o.expected)} ${dueChip(jobDue(jobOfOrder(o.id)||{items:[{stage:99}]}))}</td></tr>`).join('')}</tbody></table></div></div>`;
};

/* ---------- LEADS ---------- */
PAGES.leads=()=>modHead('leads','Write down every enquiry here – just name, mobile and what they want. Then turn it into a quotation with one click.',`<button class="btn pri" onclick="newLead()">${ic('plus')}New Lead</button>`)+`
  <div class="grid g4 mb">${[['All leads',S.leads.length,'#64748B'],['Open – call them',S.leads.filter(l=>l.status==='Open').length,'#3B82F6'],['Quotation sent',S.leads.filter(l=>l.status==='Quoted').length,'#F59E0B'],['Became customers',S.leads.filter(l=>l.status==='Converted').length,'#16A34A']].map(x=>`<div class="card kpi" style="cursor:default"><div class="l">${x[0]}</div><div class="v" style="color:${x[2]}">${x[1]}</div></div>`).join('')}</div>
  <div class="card"><div class="bar">${fsearch('leadQ','Search name, mobile or place…','leadRows')}${fsel('leadSt','All statuses',['Open','Contacted','Quoted','Converted','Lost'],'leadRows')}${fsel('leadSrc','All sources',SOURCES,'leadRows')}</div>
  <div class="tw"><table><thead><tr><th>Customer</th><th>Lead no.</th><th>Place</th><th>Requirement</th><th>Source</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="leadRows">${leadRows()}</tbody></table></div>
  <div class="tfoot">Showing ${S.leads.length} lead(s)<span>Tip: tap a row to edit</span></div></div>`;
function leadRows(){const q=UI.leadQ.toLowerCase();const r=S.leads.filter(l=>(!UI.leadSt||l.status===UI.leadSt)&&(!UI.leadSrc||l.source===UI.leadSrc)&&(!q||[l.name,l.mobile,l.place,l.req,l.id].join(' ').toLowerCase().includes(q)));
  return r.map(l=>`<tr class="click" onclick="newLead('${l.id}')"><td><div class="who">${av(l.name)}<div><b>${esc(title(l.name))}</b><small>${esc(l.mobile)}</small></div></div></td><td class="code">${l.id}</td><td>${esc(l.place)}</td><td>${esc(l.req||'—')}</td><td><span class="pill p-gray">${l.source}</span></td><td>${pill(l.status)}</td><td>${fmtD(l.date)}</td>
   <td class="right" onclick="event.stopPropagation()">${['Open','Contacted'].includes(l.status)?`<button class="btn sm pri" onclick="openQuoteForm({lead:'${l.id}'})">${ic('file-plus')}Make Quotation</button>`:''}</td></tr>`).join('')||emptyRow(8,'No leads match. Try clearing the search.','search-x')}
function newLead(id){const l=S.leads.find(x=>x.id===id)||{};const nid=id||'SVW-LEAD-'+pad(S.seq.lead,6);
  openModal(id?'Edit Lead':'New Lead',`<div class="help">${ic('info')}<div>Only 4 things are needed. Takes 30 seconds.</div></div><div class="form">
  <div class="fld"><label>Customer name <em>*</em></label><input class="inp" id="l_name" value="${esc(l.name||'')}" placeholder="e.g. Arun Kumar"></div>
  <div class="fld"><label>Mobile number <em>*</em></label><input class="inp" id="l_mob" inputmode="tel" value="${esc(l.mobile||'')}" placeholder="e.g. 98765 43210"></div>
  <div class="fld"><label>Place <em>*</em></label><input class="inp" id="l_place" value="${esc(l.place||'')}" placeholder="e.g. Palakkad"></div>
  <div class="fld"><label>What do they want?</label><input class="inp" id="l_req" value="${esc(l.req||'')}" placeholder="e.g. Main door + wardrobe"></div>
  <div class="fld full"><label>How did they find us? <em>*</em></label><div class="chips">${SOURCES.map((s,i)=>`<label><input type="radio" name="l_src" value="${s}" ${(l.source||'Phone')===s?'checked':''}><span>${s}</span></label>`).join('')}</div></div>
  ${id?`<div class="fld"><label>Status</label><select class="sel" id="l_st">${['Open','Contacted','Quoted','Converted','Lost'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
  <div class="fld ${id?'':'full'}"><label>Notes (optional)</label><input class="inp" id="l_notes" value="${esc(l.notes||'')}" placeholder="e.g. Call after 6 pm"></div></div>`,
  `${id?`<button class="btn red" style="margin-right:auto" onclick="ask('Delete this lead?',()=>{S.leads=S.leads.filter(x=>x.id!=='${id}');save();rerender();toast('Lead deleted','trash-2')})">${ic('trash-2')}Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveLead('${id||''}')">${ic('check')}${id?'Save changes':'Create Lead'}</button>`)}
function saveLead(id){const name=val('l_name'),mobile=val('l_mob'),place=val('l_place');if(!name||!mobile||!place)return toast('Please fill name, mobile and place','alert-circle');
  const data={name,mobile,place,req:val('l_req'),source:document.querySelector('input[name=l_src]:checked').value,notes:val('l_notes')};
  if(id){Object.assign(S.leads.find(x=>x.id===id),data,{status:val('l_st')})}else{const nid='SVW-LEAD-'+pad(S.seq.lead++,6);S.leads.unshift({id:nid,...data,status:'Open',date:todayISO()});audit(`Lead ${nid} created for ${name}`)}
  save();closeModal();rerender();toast(id?'Lead updated':'Lead created – now make a quotation when ready')}

/* ---------- CUSTOMERS ---------- */
PAGES.customers=()=>modHead('customers','Customers are added automatically when a quotation becomes an order. Start a new quotation for any old customer from here.')+`
  <div class="card"><div class="bar">${fsearch('cusQ','Search customer number, name or mobile…','cusRows')}<span class="muted small b">${S.customers.length} records</span></div>
  <div class="tw"><table><thead><tr><th>Customer</th><th>Customer no.</th><th>Mobile</th><th>Category</th><th>Source</th><th>Added on</th><th>Orders</th><th>Status</th><th></th></tr></thead><tbody id="cusRows">${cusRows()}</tbody></table></div></div>`;
function cusRows(){const q=UI.cusQ.toLowerCase();return S.customers.filter(c=>!q||[c.id,c.name,c.mobile].join(' ').toLowerCase().includes(q)).map(c=>{const os=S.orders.filter(o=>o.cust.toLowerCase()===c.name.toLowerCase());return`<tr><td><div class="who">${av(c.name)}<div><b>${esc(title(c.name))}</b><small>${esc(c.company)}</small></div></div></td><td class="code">${c.id}</td><td>${esc(c.mobile)}</td><td><span class="pill p-amber">${c.cat}</span></td><td>${c.source}</td><td>${fmtDT(c.at)}</td><td>${os.length?os.map(o=>`<span class="link small" onclick="viewOrder('${o.id}')">${o.id}</span>`).join(', '):'—'}</td><td>${pill(c.active?'Active':'Inactive')}</td><td class="right"><button class="btn sm" onclick="openQuoteForm({customer:'${c.id}'})">${ic('file-plus')}New Quotation</button></td></tr>`}).join('')||emptyRow(9,'No customers found','users')}

/* ---------- QUOTATIONS ---------- */
const QCOL={Draft:'#F8A48F',Sent:'#F7D58B',Approved:'#93E2A6',Converted:'#A9C4FF',Rejected:'#D4D8E2'};
PAGES.quotations=()=>{const st=['Draft','Sent','Approved','Converted','Rejected'];
  return modHead('quotations','Make a price quote for the customer. Pick items from the Item Master and the price fills in by itself.',`${seg('quoView',[['list','☰ List'],['board','▦ Board']])}<button class="btn pri" onclick="openQuoteForm()">${ic('plus')}New Quotation</button>`)+
  (UI.quoView==='board'?`<div class="help">${ic('mouse-pointer-click')}<div>Each column is a step. Click a card to open it and move it forward.</div></div><div class="kan">${st.map(s=>{const qs=S.quotations.filter(q=>q.status===s);return`<div class="kcol"><div class="kh" style="background:${QCOL[s]};border-color:${QCOL[s]};color:#1E2433"><div class="t">${s==='Converted'?'Converted to order':s}<span>${qs.length}</span></div><div class="a">${inr(qs.reduce((a,q)=>a+total(q),0),1)}</div></div><div class="kbody">
    ${qs.map(q=>`<div class="kc" onclick="viewQuote('${q.id}')"><div class="t">${esc(q.cust)}</div><div class="m">${q.id} · ${q.cat}</div><div class="f"><b class="tnum">${inr(total(q),1)}</b>${av(q.cust)}</div></div>`).join('')||'<div class="kc" style="cursor:default"><div class="ghost-row" style="width:70%"></div><div class="ghost-row" style="width:45%"></div></div><div class="small muted" style="text-align:center;padding:6px">Nothing here</div>'}</div></div>`}).join('')}</div>`
  :`<div class="card"><div class="bar">${seg('quoMine',[[false,'All quotations'],[true,'My quotations']])}${fsearch('quoQ','Search quotation number or customer…','quoRows')}${fsel('quoSt','All statuses',st,'quoRows')}${fsel('quoCat','All categories',CATS,'quoRows')}</div>
  <div class="tw"><table><thead><tr><th>Quotation</th><th>Customer</th><th>Category</th><th>Status</th><th class="right">Total</th><th>Created</th><th></th></tr></thead><tbody id="quoRows">${quoRows()}</tbody></table></div>
  <div class="tfoot">Showing ${S.quotations.length} quotations</div></div>`)};
function quoRows(){const q=UI.quoQ.toLowerCase();const me=ROLES[S.role];return S.quotations.filter(x=>(!UI.quoMine||x.sales===me||S.role==='Admin')&&(!UI.quoSt||x.status===UI.quoSt)&&(!UI.quoCat||x.cat===UI.quoCat)&&(!q||[x.id,x.cust,x.company].join(' ').toLowerCase().includes(q))).map(x=>`<tr class="click" onclick="viewQuote('${x.id}')"><td class="code b" style="font-size:13px">${x.id}</td><td><div class="who">${av(x.cust)}<div><b>${esc(x.cust)}</b><small>${esc(x.company||'—')}</small></div></div></td><td><span class="pill p-amber">${x.cat}</span></td><td>${pill(x.status==='Converted'?'Converted':x.status).replace('>Converted<','>Converted to order<')}${x.order?`<div><span class="link small" onclick="event.stopPropagation();viewOrder('${x.order}')">Order ${x.order}</span></div>`:''}</td><td class="right tnum b">${inr(total(x),1)}</td><td>${fmtDT(x.at)}</td><td class="right" onclick="event.stopPropagation()">${quoAction(x)}</td></tr>`).join('')||emptyRow(7,'No quotations found','file-search')}
function quoAction(x){return x.status==='Draft'?`<button class="btn sm" onclick="setQuo('${x.id}','Sent')">${ic('send')}Mark as sent</button>`:x.status==='Sent'?`<button class="btn sm green" onclick="setQuo('${x.id}','Approved')">${ic('thumbs-up')}Customer agreed</button>`:x.status==='Approved'?`<button class="btn sm pri" onclick="convertQuote('${x.id}')">${ic('arrow-right-circle')}Make Order</button>`:''}
function setQuo(id,s){const q=S.quotations.find(x=>x.id===id);q.status=s;audit(`Quotation ${id} marked ${s}`);const l=S.leads.find(x=>x.id===q.lead);if(l&&s==='Rejected')l.status='Lost';save();closeModal();rerender();toast(`${id} is now ${s}`)}
function viewQuote(id){const q=S.quotations.find(x=>x.id===id),t=totals(q);
  openModal(`${q.id} ${pill(q.status)}`,`<div class="grid g2 mb"><dl class="kv"><dt>Customer</dt><dd>${esc(q.cust)}</dd><dt>Company</dt><dd>${esc(q.company||'—')}</dd><dt>Mobile</dt><dd>${esc(q.mobile||'—')}</dd><dt>Category</dt><dd>${q.cat}</dd></dl><dl class="kv"><dt>Sales person</dt><dd>${esc(q.sales||'—')}</dd><dt>Created</dt><dd>${fmtDT(q.at)}</dd><dt>Delivery by</dt><dd>${fmtD(q.expected)}</dd>${q.order?`<dt>Order</dt><dd><span class="link" onclick="viewOrder('${q.order}')">${q.order}</span></dd>`:''}</dl></div>
  ${docLinesTable(q)}<div class="totals" style="margin-top:12px"><div><span class="muted">Subtotal</span><b>${inr(t.sub,1)}</b></div>${t.disc?`<div><span class="muted">Discount ${q.discPct}%</span><b>−${inr(t.disc,1)}</b></div>`:''}${t.tax?`<div><span class="muted">Tax ${q.taxPct}%</span><b>${inr(t.tax,1)}</b></div>`:''}<div class="gt"><span>Grand total</span><span>${inr(t.total,1)}</span></div></div>
  <div class="sec" style="margin-top:16px"><h4>Notes / terms</h4><div class="small muted" style="white-space:pre-line">${esc(q.notes||'—')}</div></div>`,
  `<button class="btn" style="margin-right:auto" onclick="printDoc('quote','${q.id}')">${ic('printer')}View quotation</button>${['Draft','Sent'].includes(q.status)?`<button class="btn red" onclick="setQuo('${q.id}','Rejected')">${ic('x')}Customer said no</button><button class="btn" onclick="openQuoteForm({edit:'${q.id}'})">${ic('pencil')}Edit</button>`:''}${quoAction(q).replace(/btn sm/g,'btn')}`,'wide')}
function docLinesTable(d){return`<div class="card tw" style="box-shadow:none"><table><thead><tr><th>Item</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Disc</th><th class="right">Amount</th></tr></thead><tbody>${d.lines.map(l=>`<tr><td class="wrap"><b>${esc(l.name)}</b>${l.desc?`<div class="small muted">${esc(l.desc)}</div>`:''}${l.measure?`<div class="small muted">Measurement: ${esc(l.measure)}</div>`:''}</td><td class="right">${l.qty} ${l.unit||''}</td><td class="right tnum">${inr(l.rate)}</td><td class="right">${l.disc?l.disc+'%':'—'}</td><td class="right tnum b">${inr(lineAmt(l),1)}</td></tr>`).join('')}${(d.charges||[]).map(c=>`<tr><td colspan="4" class="muted">${esc(c.label)}</td><td class="right tnum b">${inr(c.amount)}</td></tr>`).join('')}</tbody></table></div>`}
/* quotation / direct order form */
let QF=null;
function openQuoteForm(o={}){
  const ed=o.edit?S.quotations.find(x=>x.id===o.edit):null;const l=S.leads.find(x=>x.id===o.lead)||{};const c=S.customers.find(x=>x.id===o.customer)||{};
  QF={mode:o.direct?'direct':ed?'edit':'new',edit:o.edit,lead:o.lead,cat:ed?.cat||c.cat||'Furniture',lines:ed?ed.lines.map(x=>({...x})):[],charges:ed?ed.charges.map(x=>({...x})):[]};
  if(!QF.lines.length)QF.lines.push(blankLine());
  const v=(k,d='')=>esc(ed?.[k]??d);
  openModal(o.direct?'Direct Order (no quotation)':ed?`Edit ${ed.id}`:'New Quotation',`
  <div class="help">${ic('lightbulb')}<div><b>3 easy steps:</b> 1) Customer details &nbsp;2) Pick the items &nbsp;3) Check total and save. Fields with <span class="c-red">*</span> are needed.</div></div>
  <div class="sec"><h4>${ic('user','width:16px')} 1. Customer details</h4><div class="form f3">
    <div class="fld"><label>Customer name <em>*</em></label><input class="inp" id="q_cust" value="${v('cust',l.name||c.name||'')}" placeholder="Customer name"></div>
    <div class="fld"><label>Mobile <em>*</em></label><input class="inp" id="q_mob" value="${v('mobile',l.mobile||c.mobile||'')}" placeholder="Mobile number"></div>
    <div class="fld"><label>Email</label><input class="inp" id="q_email" value="${v('email')}" placeholder="Optional"></div>
    <div class="fld"><label>Company</label><input class="inp" id="q_comp" value="${v('company',c.company||'')}" placeholder="Optional"></div>
    <div class="fld"><label>Address</label><input class="inp" id="q_addr" value="${v('address',l.place||'')}" placeholder="Optional"></div>
    <div class="fld"><label>Category <em>*</em></label><select class="sel" id="q_cat" onchange="QF.cat=this.value;document.getElementById('q_notes').value=NOTES[this.value];drawLines()">${CATS.map(x=>`<option ${QF.cat===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="fld"><label>Sales person</label><input class="inp" id="q_sales" value="${v('sales',ROLES[S.role]==='System Administrator'?'':ROLES[S.role])}" placeholder="Sales person name"></div>
    <div class="fld"><label>Expected delivery date <em>*</em></label><input class="inp" type="date" id="q_exp" value="${v('expected',addDays(todayISO(),21))}"></div>
    ${o.direct?`<div class="fld"><label>Advance received (₹)</label><input class="inp" type="number" id="q_adv" value="0"></div>`:''}
  </div>${l.req?`<div class="help warn" style="margin:12px 0 0">${ic('message-square')}Customer asked for: <b>${esc(l.req)}</b></div>`:''}</div>
  <div class="sec"><h4>${ic('list','width:16px')} 2. Items</h4><div class="lines" id="qlines"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="QF.lines.push(blankLine());drawLines()">${ic('plus')}Add item</button><button class="btn sm" onclick="QF.charges.push({label:'Transport Charge',amount:0});drawLines()">${ic('truck')}Add extra charge (polish, transport…)</button></div></div>
  <div class="sec"><h4>${ic('calculator','width:16px')} 3. Price & notes</h4><div class="grid g2"><div>
    <div class="form"><div class="fld"><label>Discount %</label><input class="inp" type="number" id="q_disc" value="${v('discPct',0)}" oninput="drawTotals()"></div><div class="fld"><label>Tax / GST %</label><input class="inp" type="number" id="q_tax" value="${v('taxPct',0)}" oninput="drawTotals()"></div>
    <div class="fld full"><label>Notes / terms (printed on quotation)</label><textarea class="inp" id="q_notes" rows="6">${esc(ed?.notes||NOTES[QF.cat])}</textarea></div></div></div>
    <div class="totals" id="qtot"></div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveQuote()">${ic('check')}${o.direct?'Create Order':ed?'Save changes':'Create Quotation'}</button>`,'wide');drawLines()}
function blankLine(){return{item:'',name:'',desc:'',qty:1,rate:0,disc:0,unit:'pcs',measure:''}}
function drawLines(){const items=S.items.filter(i=>i.active&&i.cat===QF.cat);
  $('#qlines').innerHTML=`<div class="ln hd"><span>Item (pick from list or type)</span><span>Qty</span><span>Rate ₹</span><span>Disc %</span><span class="right">Amount</span><span></span></div>`+QF.lines.map((l,k)=>`<div class="ln">
   <div><select class="sel" style="width:100%" onchange="pickItem(${k},this.value)"><option value="">— Pick item (${QF.cat}) —</option>${items.map(i=>`<option value="${i.id}" ${l.item===i.id?'selected':''}>${esc(i.name)} · ${inr(i.price)}</option>`).join('')}<option value="_c" ${!l.item&&l.name?'selected':''}>✎ Type my own item</option></select>
     ${!l.item&&l.name!==undefined&&(l._c||(!l.item&&l.name))?`<input class="inp" style="width:100%;margin-top:6px" placeholder="Item name" value="${esc(l.name)}" oninput="QF.lines[${k}].name=this.value">`:''}
     ${l.item||l.name?`<input class="inp" style="width:100%;margin-top:6px;height:32px;font-size:12.5px" placeholder="Measurement / size (optional)" value="${esc(l.measure||'')}" oninput="QF.lines[${k}].measure=this.value">`:''}</div>
   <input class="inp" type="number" min="1" value="${l.qty}" oninput="QF.lines[${k}].qty=+this.value||0;drawTotals();this.closest('.ln').querySelector('.amt').textContent=inr(lineAmt(QF.lines[${k}]),1)">
   <input class="inp" type="number" value="${l.rate}" oninput="QF.lines[${k}].rate=+this.value||0;drawTotals();this.closest('.ln').querySelector('.amt').textContent=inr(lineAmt(QF.lines[${k}]),1)">
   <input class="inp" type="number" value="${l.disc||0}" oninput="QF.lines[${k}].disc=+this.value||0;drawTotals();this.closest('.ln').querySelector('.amt').textContent=inr(lineAmt(QF.lines[${k}]),1)">
   <div class="amt tnum">${inr(lineAmt(l),1)}</div><button class="ibtn" style="width:34px;height:34px" title="Remove" onclick="QF.lines.splice(${k},1);if(!QF.lines.length)QF.lines.push(blankLine());drawLines()">${ic('trash-2','width:15px')}</button></div>`).join('')
   +QF.charges.map((c,k)=>`<div class="ln"><select class="sel" onchange="QF.charges[${k}].label=this.value">${['Polishing Charge','Transport Charge','Fixing Charge','Other Charge'].map(x=>`<option ${c.label===x?'selected':''}>${x}</option>`).join('')}</select><span></span><input class="inp" type="number" value="${c.amount}" oninput="QF.charges[${k}].amount=+this.value||0;drawTotals()"><span></span><span class="muted small right">extra</span><button class="ibtn" style="width:34px;height:34px" onclick="QF.charges.splice(${k},1);drawLines()">${ic('trash-2','width:15px')}</button></div>`).join('');
  lucide.createIcons();drawTotals()}
function pickItem(k,id){const l=QF.lines[k];if(id==='_c'){Object.assign(l,{item:'',name:'',desc:'',_c:true});}else{const i=S.items.find(x=>x.id===id);if(i)Object.assign(l,{item:i.id,name:i.name,desc:i.desc,rate:i.price,unit:i.unit,_c:false});else Object.assign(l,blankLine())}drawLines()}
function drawTotals(){const t=totals({lines:QF.lines,charges:QF.charges,discPct:num('q_disc'),taxPct:num('q_tax')});$('#qtot').innerHTML=`<div><span class="muted">Subtotal</span><b class="tnum">${inr(t.sub,1)}</b></div><div><span class="muted">Discount</span><b class="tnum">−${inr(t.disc,1)}</b></div><div><span class="muted">Tax</span><b class="tnum">${inr(t.tax,1)}</b></div><div class="gt"><span>Grand total</span><span class="tnum">${inr(t.total,1)}</span></div>`}
function saveQuote(){const cust=val('q_cust'),mobile=val('q_mob'),exp=val('q_exp');if(!cust||!mobile||!exp)return toast('Please fill customer name, mobile and delivery date','alert-circle');
  const lines=QF.lines.filter(l=>l.name&&l.qty>0).map(({_c,...x})=>x);if(!lines.length)return toast('Add at least one item','alert-circle');
  const doc={cust,mobile,email:val('q_email'),company:val('q_comp'),address:val('q_addr'),cat:val('q_cat'),sales:val('q_sales'),expected:exp,lines,charges:QF.charges.filter(c=>c.amount>0),discPct:num('q_disc'),taxPct:num('q_tax'),notes:$('#q_notes').value};
  if(QF.mode==='direct'){const id=createOrder(doc,'DIRECT',num('q_adv'));closeModal();if(UI.route!=='orders')nav('orders');else rerender();setTimeout(()=>viewOrder(id),50);return}
  if(QF.mode==='edit'){Object.assign(S.quotations.find(x=>x.id===QF.edit),doc);save();closeModal();rerender();return toast('Quotation updated')}
  const id='SVW-QUO-'+pad(S.seq.quo++,6);S.quotations.unshift({id,...doc,status:'Draft',at:nowISO(),order:'',lead:QF.lead});
  const l=S.leads.find(x=>x.id===QF.lead);if(l)l.status='Quoted';audit(`Quotation ${id} created for ${cust}`);save();closeModal();
  if(UI.route!=='quotations')nav('quotations');else rerender();toast(`${id} created. Print it or mark it as sent.`)}
function convertQuote(id){const q=S.quotations.find(x=>x.id===id);
  openModal('Make this an Order',`<div class="help good">${ic('party-popper')}<div>Customer agreed! <b>${esc(q.cust)}</b> · ${inr(total(q),1)}. Each item will go to the workshop as a job.</div></div><div class="form">
  <div class="fld"><label>Delivery date <em>*</em></label><input class="inp" type="date" id="c_exp" value="${q.expected||addDays(todayISO(),21)}"></div><div class="fld"><label>Advance received now (₹)</label><input class="inp" type="number" id="c_adv" value="0"><div class="hint">Leave 0 if no advance yet</div></div>
  <div class="fld full"><label>Delivery address</label><input class="inp" id="c_addr" value="${esc(q.address||'')}"></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="doConvert('${id}')">${ic('check')}Confirm Order</button>`)}
function doConvert(id){const q=S.quotations.find(x=>x.id===id);const exp=val('c_exp');if(!exp)return toast('Pick a delivery date','alert-circle');
  const oid=createOrder({...q,expected:exp,address:val('c_addr')||q.address},q.id,num('c_adv'));q.status='Converted';q.order=oid;
  const l=S.leads.find(x=>x.id===q.lead);if(l)l.status='Converted';save();closeModal();rerender()}
function createOrder(doc,src,adv){const id='ORD'+pad(S.seq.ord++,6);
  S.orders.unshift({id,cust:doc.cust,mobile:doc.mobile,address:doc.address||'',cat:doc.cat,src,date:nowISO(),expected:doc.expected,sales:doc.sales||'',lines:doc.lines.map(x=>({...x})),charges:(doc.charges||[]).map(x=>({...x})),discPct:doc.discPct||0,taxPct:doc.taxPct||0,delivered:false});
  if(!S.customers.some(c=>c.name.toLowerCase()===doc.cust.toLowerCase()))S.customers.unshift({id:'SVW-CUS-'+pad(S.seq.cus++,6),name:doc.cust,company:doc.company||'',mobile:doc.mobile,cat:doc.cat,source:src==='DIRECT'?'Direct':'Quotation',at:nowISO(),active:true});
  const jid='JOB-2026-'+pad(S.seq.job++,4);
  S.jobs.unshift({id:jid,order:id,manager:'HARIDAS',created:nowISO(),items:doc.lines.map(l=>({name:l.name,qty:l.qty,stage:0,team:'',history:[{stage:'Assigned',at:nowISO(),by:ROLES[S.role]}]})),cut:[],costs:[],history:[{at:nowISO(),by:ROLES[S.role],msg:'Order assigned to production'}]});
  S.orderLog[id]=[{at:nowISO(),msg:`Assigned to production (${jid})`},{at:nowISO(),msg:src==='DIRECT'?'Direct order created':`Order created from quotation ${src}`}];
  if(adv>0){S.payments.push({id:'PAY-'+pad(S.payments.length+1,4),order:id,at:nowISO(),amount:adv,mode:'UPI',by:ROLES[S.role]});S.orderLog[id].unshift({at:nowISO(),msg:`Advance of ${inr(adv)} received`})}
  audit(`Order ${id} created (${src}) and sent to production as ${jid}`);save();toast(`Order ${id} created and sent to the workshop (${jid})`);return id}

/* ---------- ITEM MASTER ---------- */
PAGES.items=()=>modHead('items','Your product list with prices. These show up when making a quotation, so you never type the same thing twice.',`<button class="btn pri" onclick="editItem()">${ic('plus')}Add Item</button>`)+`
  <div class="card"><div class="bar">${fsearch('itemQ','Search item name or description…','itemRows')}${fsel('itemCat','All categories',CATS,'itemRows')}</div>
  <div class="tw"><table><thead><tr><th></th><th>Item</th><th>Category</th><th>Price basis</th><th>Unit</th><th class="right">Price</th><th>Status</th><th></th></tr></thead><tbody id="itemRows">${itemRows()}</tbody></table></div><div class="tfoot">${S.items.length} items</div></div>`;
function itemRows(){const q=UI.itemQ.toLowerCase();return S.items.filter(i=>(!UI.itemCat||i.cat===UI.itemCat)&&(!q||[i.name,i.desc,i.unit].join(' ').toLowerCase().includes(q))).map(i=>`<tr class="click" onclick="editItem('${i.id}')"><td style="width:58px"><div class="imgph">${ic(i.cat==='Joinery'?'door-open':i.cat==='Interior'?'tv':'armchair')}</div></td><td class="wrap"><b>${esc(i.name)}</b><div class="small muted">${esc(i.desc)}</div></td><td><span class="pill p-amber">${i.cat}</span></td><td>${i.basis==='Per Sqft'?'Per square feet':'Per piece'}</td><td>${i.unit}</td><td class="right tnum b">${inr(i.price,1)}</td><td>${pill(i.active?'Active':'Inactive')}</td><td>${ic('chevron-right','color:#B8C0D2')}</td></tr>`).join('')||emptyRow(8,'No items found','box')}
function editItem(id){const i=S.items.find(x=>x.id===id)||{cat:'Furniture',basis:'Per Piece',unit:'pcs',active:true};
  openModal(id?'Edit Item':'Add Item',`<div class="form"><div class="fld full"><label>Item name <em>*</em></label><input class="inp" id="i_name" value="${esc(i.name||'')}" placeholder="e.g. 6.5X6 PILLER COT"></div>
  <div class="fld full"><label>Description</label><input class="inp" id="i_desc" value="${esc(i.desc||'')}" placeholder="e.g. Full teak wood, bottom round"></div>

function viewOrder(id){const o=order(id);if(!o)return;const t=total(o),p=paidOf(id),j=jobOfOrder(id),st=orderStatus(o);
  const mcost=j?j.cut.reduce((a,c)=>a+pieceCost(c)*(lineQty(j,c.item)),0):0;
  const pays=S.payments.filter(x=>x.order===id);const log=S.orderLog[id]||[];

  <div class="card mb" style="box-shadow:none;padding:14px"><div class="track">${steps.map(s=>`<span class="${s[1]?'done':''}">${s[1]?ic('check'):''}${s[0]}</span>`).join(ic('chevron-right','width:14px;color:#B8C0D2;align-self:center'))}</div></div>
  <div class="grid g2 mb"><div class="sec" style="margin:0"><h4>${ic('user','width:16px')}Customer</h4><dl class="kv"><dt>Name</dt><dd>${esc(o.cust)}</dd><dt>Mobile</dt><dd>${esc(o.mobile||'—')}</dd><dt>Delivery address</dt><dd>${esc(o.address||'—')}</dd></dl></div>
  <div class="sec" style="margin:0"><h4>${ic('calendar','width:16px')}Dates</h4><dl class="kv"><dt>Order date</dt><dd>${fmtD(o.date)}</dd><dt>Delivery by</dt><dd>${fmtD(o.expected)} ${dueChip(j?jobDue(j):null)}</dd><dt>Sales person</dt><dd>${esc(o.sales||'—')}</dd>${j?`<dt>Workshop job</dt><dd><a class="link" href="#job/${j.id}" onclick="closeModal()">${j.id}</a></dd>`:''}</dl></div></div>
  <div class="sec"><h4>${ic('list','width:16px')}Order items</h4><div class="card tw" style="box-shadow:none"><table><thead><tr><th>Item</th><th>Category</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Total</th><th>Workshop stage</th></tr></thead><tbody>
   ${o.lines.map((l,k)=>`<tr><td class="wrap b">${esc(l.name)}</td><td>${o.cat}</td><td class="right">${l.qty} ${l.unit||''}</td><td class="right tnum">${inr(l.rate)}</td><td class="right tnum b">${inr(lineAmt(l))}</td><td>${j&&j.items[k]?stagePill(S.template[j.items[k].stage]):'—'}</td></tr>`).join('')}</tbody></table></div></div>
  ${j&&j.cut.length?`<div class="sec"><h4>${ic('scissors','width:16px')}Cutting list · ${j.cut.length} pieces · ${inr(mcost)} material</h4>${cutTable(j,false)}</div>`:''}
  <div class="grid g2"><div class="sec"><h4>${ic('wallet','width:16px')}Payment history</h4>${pays.map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)"><div><b class="c-green">${inr(x.amount)}</b> via ${x.mode}<div class="small muted">${fmtDT(x.at)} · by ${esc(x.by)}</div></div><span class="code">${x.id}</span></div>`).join('')||'<div class="small muted">No payments yet</div>'}</div>
  <div class="sec"><h4>${ic('history','width:16px')}Activity</h4><div class="timeline">${log.map(e=>`<div class="ev">${esc(e.msg)}<small>${fmtDT(e.at)}</small></div>`).join('')||'<div class="small muted">No activity yet</div>'}</div></div></div>`,
  `<button class="btn" style="margin-right:auto" onclick="printDoc('invoice','${o.id}')">${ic('printer')}View invoice</button>${st==='Ready for Delivery'?`<button class="btn" onclick="markDelivered('${o.id}')">${ic('truck')}Mark as delivered</button>`:''}${t-p>0&&allowed().some(k=>['billing','orders'].includes(k))?`<button class="btn green" onclick="recordPayment('${o.id}')">${ic('indian-rupee')}Record payment</button>`:''}`,'drawer')}
function markDelivered(id){const o=order(id);o.delivered=true;(S.orderLog[id]=S.orderLog[id]||[]).unshift({at:nowISO(),msg:'Delivered to customer'});audit(`Order ${id} delivered`);save();viewOrder(id);rerender();toast('Marked as delivered 🚚')}

function recordPayment(oid){const open=S.orders.filter(o=>total(o)-paidOf(o.id)>0);if(!open.length)return toast('No balance pending on any order 🎉');const sel=oid||open[0].id,o=order(sel);
  openModal('Record Payment',`<div class="form"><div class="fld full"><label>Which order?</label><select class="sel" id="r_o" onchange="const o=order(this.value);document.getElementById('r_a').value=total(o)-paidOf(o.id)">${open.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.id} · ${esc(x.cust)} · balance ${inr(total(x)-paidOf(x.id))}</option>`).join('')}</select></div>
  <div class="fld"><label>Amount received (₹) <em>*</em></label><input class="inp" type="number" id="r_a" value="${total(o)-paidOf(o.id)}"></div><div class="fld"><label>Date</label><input class="inp" type="date" id="r_d" value="${todayISO()}"></div>
  <div class="fld full"><label>Paid by</label><div class="chips">${['UPI','Cash','Bank Transfer','Cheque'].map((m,i)=>`<label><input type="radio" name="r_m" value="${m}" ${i?'':'checked'}><span>${m}</span></label>`).join('')}</div></div></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="savePayment()">${ic('check')}Save payment</button>`)}
function savePayment(){const a=num('r_a'),oid=val('r_o');if(a<=0)return toast('Enter the amount','alert-circle');const bal=total(order(oid))-paidOf(oid);if(a>bal)return toast(`Amount is more than the balance (${inr(bal)}). Please check.`,'alert-circle');
  const m=document.querySelector('input[name=r_m]:checked').value;S.payments.push({id:'PAY-'+pad(S.payments.length+1,4),order:oid,at:val('r_d')+nowISO().slice(10),amount:a,mode:m,by:ROLES[S.role]});
  (S.orderLog[oid]=S.orderLog[oid]||[]).unshift({at:nowISO(),msg:`Payment of ${inr(a)} received via ${m}. Balance ${inr(bal-a)}`});audit(`Payment ${inr(a)} received for ${oid} via ${m}`);save();closeModal();rerender();toast(`${inr(a)} saved for ${oid}`)}

PAGES.materials=()=>{const low=lowStock();return modHead('materials','Wood, hardware, glue and everything you buy. Red means stock is low – time to buy more.',`<button class="btn green" onclick="editMaterial()">${ic('plus')}Add Material & Stock</button>`)+
  (low.length?`<div class="help warn">${ic('alert-triangle')}<div><b>${low.length} items are running low:</b> ${low.map(m=>esc(m.name)).join(', ')}</div></div>`:'')+`
  <div class="card"><div class="bar">${fsearch('matQ','Search materials…','matRows')}${fsel('matType','All types',MTYPES,'matRows')}</div>
  <div class="tw"><table><thead><tr><th>Name</th><th>Type</th><th>Unit</th><th class="right">Price / unit</th><th class="right">In stock</th><th>Status</th><th>Added</th><th class="right">Actions</th></tr></thead><tbody id="matRows">${matRows()}</tbody></table></div><div class="tfoot">${S.materials.length} materials · stock value ${inr(S.materials.reduce((a,m)=>a+m.stock*m.price,0))}</div></div>`};

function matRows(){const q=UI.matQ.toLowerCase();return S.materials.filter(m=>(!UI.matType||m.type===UI.matType)&&(!q||[m.name,m.desc].join(' ').toLowerCase().includes(q))).map(m=>{const low=m.stock<m.min;return`<tr><td><b>${esc(m.name)}</b>${m.desc?`<div class="small muted">${esc(m.desc)}</div>`:''}</td><td><span class="pill ${TYPE_PILL[m.type]}">${m.type}</span></td><td>${m.unit}</td><td class="right tnum b">${inr(m.price,1)}</td><td class="right"><span class="pill ${low?'p-red':'p-green'}">${m.stock} ${m.unit}</span></td><td>${low?'<span class="pill p-red">Buy more</span>':pill(m.active?'Active':'Inactive')}</td><td>${fmtD(m.at)}</td><td class="right"><button class="btn sm" title="Add stock" onclick="addStock('${m.id}')">${ic('package-plus')}Add stock</button> <button class="btn sm ghost" title="Edit" onclick="editMaterial('${m.id}')">${ic('pencil')}</button></td></tr>`}).join('')||emptyRow(8,'No materials found','package')}
function editMaterial(id){const m=mat(id)||{type:'Timber',unit:'cft',active:true,min:5};
  openModal(id?'Edit Material':'Add Material & Stock',`<div class="form"><div class="fld full"><label>Material name <em>*</em></label><input class="inp" id="m_name" value="${esc(m.name||'')}" placeholder="e.g. Teak Plank"></div>
  <div class="fld full"><label>Short description</label><input class="inp" id="m_desc" value="${esc(m.desc||'')}"></div>

  <div class="fld"><label>Price per unit (₹) <em>*</em></label><input class="inp" type="number" id="m_price" value="${m.price||''}"></div><div class="fld"><label>${id?'Stock now':'Opening stock'}</label><input class="inp" type="number" id="m_stock" value="${m.stock||0}"></div>
  <div class="fld"><label>Warn me when stock is below</label><input class="inp" type="number" id="m_min" value="${m.min}"></div></div>`,
  `${id?`<button class="btn red" style="margin-right:auto" onclick="ask('Delete this material?',()=>{S.materials=S.materials.filter(x=>x.id!=='${id}');save();rerender()})">${ic('trash-2')}Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveMaterial('${id||''}')">${ic('check')}Save</button>`)}
function saveMaterial(id){const name=val('m_name'),price=num('m_price');if(!name||!price)return toast('Name and price are needed','alert-circle');const d={name,desc:val('m_desc'),type:val('m_type'),unit:val('m_unit')||'piece',price,stock:num('m_stock'),min:num('m_min')};

function addStock(id){const m=mat(id);openModal(`Add stock – ${esc(m.name)}`,`<div class="help">${ic('info')}Now in stock: <b>${m.stock} ${m.unit}</b></div><div class="form"><div class="fld"><label>Quantity bought (${m.unit})</label><input class="inp" type="number" id="as_q" value="1"></div><div class="fld"><label>Price per unit (₹)</label><input class="inp" type="number" id="as_p" value="${m.price}"></div><div class="fld full"><label>Supplier (optional)</label><input class="inp" id="as_s" placeholder="e.g. Palakkad Timber Depot"></div></div>`,

function jobFiltered(){const q=UI.jobQ.toLowerCase();return S.jobs.filter(j=>{const o=order(j.order);const d=jobDue(j);return(!UI.jobCat||o.cat===UI.jobCat)&&(!UI.jobStage||j.items.some(i=>S.template[i.stage]===UI.jobStage))&&(!UI.jobUrgent||(d!=null&&d<=5))&&(!q||[j.id,j.order,o.cust].join(' ').toLowerCase().includes(q))}).sort((a,b)=>(jobDue(a)??999)-(jobDue(b)??999))}
function jobBody(){const js=jobFiltered();
